<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Mission | Puzzle Game | Salam Adventures</title><meta name="description" content="Play Maze Mission, a free child-friendly puzzle game with levels, goals, sound feedback and increasingly tricky routes."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/Maze%20Mission.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#eaf7ff,#fff6e8);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#10294a;color:#fff;border-radius:34px;padding:28px;min-height:620px;box-shadow:0 20px 50px #0002}.hud{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:800}.maze{margin:26px auto 18px;display:grid;gap:5px;max-width:720px}.cell{aspect-ratio:1/1;border-radius:10px;background:#dff4ff;display:grid;place-items:center;font-size:2rem}.wall{background:#203b66}.player{background:#fff0a8}.goal{background:#c6ffd9}.controls{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}.controls button{border:0;border-radius:16px;min-height:58px;background:#fff;color:#17335d;font-size:1.5rem;font-weight:900;cursor:pointer}.msg{text-align:center;font-weight:800;font-size:1.15rem;min-height:30px}@media(max-width:700px){.game{padding:16px}.cell{font-size:1.4rem}.controls{grid-template-columns:repeat(3,64px)}}</style><link rel="stylesheet" href="/arcade-theme.css">
</head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>🗺️ Maze Mission</h1><p>Guide the explorer through the maze to reach the star.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Moves <b id="moves">0</b></span><span>Goal: reach ⭐</span></div><div class="maze" id="maze"></div><div class="controls"><span></span><button data-d="u">↑</button><span></span><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button></div><div class="msg" id="msg">Find the path.</div></div></div><script>let level=1,moves=0,pos={r:0,c:0},size=6,walls=[];function beep(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.08)}function build(){size=Math.min(5+level,9);pos={r:0,c:0};moves=0;walls=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++){if((r===0&&c===0)||(r===size-1&&c===size-1))continue;if(Math.random()<Math.min(.16+level*.015,.28))walls.push(`${r},${c}`)}for(let i=0;i<size;i++){walls=walls.filter(x=>x!==`${i},${i}`&&x!==`${i},${Math.min(i+1,size-1)}`)}render()}function render(){maze.style.gridTemplateColumns=`repeat(${size},1fr)`;maze.innerHTML='';for(let r=0;r<size;r++)for(let c=0;c<size;c++){const d=document.createElement('div');d.className='cell';if(walls.includes(`${r},${c}`))d.classList.add('wall');if(r===size-1&&c===size-1){d.classList.add('goal');d.textContent='⭐'}if(r===pos.r&&c===pos.c){d.classList.add('player');d.textContent='🚀'}maze.appendChild(d)}document.getElementById('level').textContent=level;document.getElementById('moves').textContent=moves}function move(d){let n={...pos};if(d==='u')n.r--;if(d==='d')n.r++;if(d==='l')n.c--;if(d==='r')n.c++;if(n.r<0||n.c<0||n.r>=size||n.c>=size||walls.includes(`${n.r},${n.c}`)){beep(150);msg.textContent='Blocked — try another route.';return}pos=n;moves++;beep(520);if(pos.r===size-1&&pos.c===size-1){level++;msg.textContent='Maze solved! Next level 🌟';beep(900);setTimeout(build,700)}render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.addEventListener('keydown',e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(m[e.key])move(m[e.key])});build();</script></body></html>
