<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compass SEN Support | Memory Matching</title>
<style>
*{box-sizing:border-box}body{font-family:Segoe UI,Tahoma,sans-serif;background:#eef4fa;margin:0;padding:16px;color:#17324d}.container{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:20px;box-shadow:0 10px 28px #0001}.header,.status,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.header{border-bottom:2px solid #f5a623;padding-bottom:12px}.logo{height:50px}.badge{margin-left:auto;background:#f2f4f7;padding:8px 14px;border-radius:30px;font-weight:800}.status{justify-content:center;margin:18px 0;font-size:18px;font-weight:800}.pill{background:#eef7ff;padding:9px 16px;border-radius:999px}.grid{display:grid;gap:16px;margin:20px auto;max-width:760px}.card{min-height:128px;border:3px solid #d6e4f2;border-radius:22px;background:#0d6f91;color:#fff;font-size:52px;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #084f68;transition:.15s;display:flex;align-items:center;justify-content:center}.card:hover{transform:translateY(-2px)}.card.open{background:#fff7df;color:#17324d;border-color:#f5a623}.card.matched{background:#dff8e8;color:#17324d;border-color:#43a96b;box-shadow:none}.message{text-align:center;background:#f4f8fc;border-radius:18px;padding:14px;font-size:18px;font-weight:700;min-height:54px}.actions{justify-content:center;margin-top:16px}button.action{border:0;border-radius:999px;padding:14px 28px;font-size:18px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#079bb6,#326fe3);color:#fff}.hidden{display:none!important}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.spark{position:absolute;font-size:30px;animation:fly 1.4s ease-out forwards}@keyframes fly{0%{transform:translateY(20vh) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-85vh) rotate(480deg) scale(1.4);opacity:0}}body.flash{animation:flash .7s}@keyframes flash{50%{filter:brightness(1.25)}}@media(max-width:620px){.card{min-height:100px;font-size:42px}.grid{gap:10px}.container{padding:14px}}
</style>










<style data-compass-hardwired-branding>
.compass-brand-bar{width:min(1180px,calc(100% - 24px));margin:12px auto 18px;padding:12px 18px;background:#fff;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 8px 22px rgba(9,49,73,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Arial,sans-serif}.compass-brand-logo{width:190px;max-width:42vw;height:auto;display:block}.compass-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:2px solid #0a98a8;border-radius:999px;color:#06365b;background:#fff;text-decoration:none;font-weight:800;font-size:16px}.compass-back-link:hover,.compass-back-link:focus{background:#eaf9fb;outline:3px solid rgba(10,152,168,.18)}.compass-copyright{width:min(1180px,calc(100% - 24px));margin:22px auto 12px;padding:14px;text-align:center;border-top:1px solid #dfe8ef;color:#31536a;font:700 13px/1.5 Arial,sans-serif;background:#fff;border-radius:16px}.compass-copyright .tagline{display:block;margin-top:4px;color:#6d3fb2;font-weight:700}@media print{.compass-back-link{display:none}.compass-brand-bar{box-shadow:none;border:none;margin:0 auto 10px}.compass-brand-logo{width:150px}.compass-copyright{box-shadow:none;border-radius:0;margin-top:12px}}@media(max-width:560px){.compass-brand-bar{justify-content:center;text-align:center}.compass-brand-logo{width:170px}.compass-back-link{width:100%}}
</style>

</head>
<body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>










<div class="container">
<div class="header"><img class="logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support" onerror="this.style.display='none'"><div><strong style="font-size:24px;color:#2c5a2e">Salam</strong><div style="color:#e0910f;font-weight:700">Adventures</div></div><div class="badge">🧠 Memory Match</div></div>
<div class="status"><span class="pill">Level <span id="level">1</span>/5</span><span class="pill">Pairs <span id="pairs">0</span>/<span id="target">3</span></span><span class="pill">Moves <span id="moves">0</span></span></div>
<div id="grid" class="grid"></div><div id="message" class="message">Find all the matching pairs.</div>
<div class="actions"><button id="next" class="action hidden">Next level ▶</button><button id="restart" class="action">Restart level ↻</button></div>
</div><div id="celebrate" class="celebrate"></div>
<script>
const pools=[['🐶','🐱','🐰','🐼','🦊','🐸','🐵','🦁'],['⭐','🌈','🎈','🚀','🎨','🎵','🍎','🧩']];
const levels=[3,4,6,8,10];let level=1,cards=[],open=[],matched=0,moves=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(ok=true){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?700:220;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function stars(){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),700);for(let i=0;i<28;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🌟','💫'][i%4];s.style.left=Math.random()*100+'vw';s.style.top=(80+Math.random()*20)+'vh';s.style.animationDelay=Math.random()*.25+'s';$('celebrate').appendChild(s);setTimeout(()=>s.remove(),1800)}}
function start(){const n=levels[level-1],source=[...pools[0],...pools[1]],chosen=shuffle(source).slice(0,n);cards=shuffle([...chosen,...chosen]).map((v,i)=>({v,id:i,open:false,done:false}));open=[];matched=0;moves=0;locked=false;$('next').classList.add('hidden');$('message').textContent='Find all the matching pairs.';render()}
function render(){const n=levels[level-1];$('level').textContent=level;$('pairs').textContent=matched;$('target').textContent=n;$('moves').textContent=moves;const cols=cards.length<=8?4:cards.length<=12?4:5;$('grid').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;$('grid').innerHTML=cards.map((c,i)=>`<button class="card ${c.open?'open':''} ${c.done?'matched':''}" data-i="${i}" ${c.done?'disabled':''}>${c.open||c.done?c.v:'?'}</button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>flip(+b.dataset.i))}
function flip(i){if(locked||cards[i].open||cards[i].done)return;cards[i].open=true;open.push(i);render();if(open.length<2)return;moves++;locked=true;const[a,b]=open;if(cards[a].v===cards[b].v){setTimeout(()=>{cards[a].done=cards[b].done=true;cards[a].open=cards[b].open=false;matched++;open=[];locked=false;tone(true);$('message').textContent='Great match!';if(matched===levels[level-1])complete();render()},350)}else{tone(false);$('message').textContent='Not a match — try again.';setTimeout(()=>{cards[a].open=cards[b].open=false;open=[];locked=false;render()},750)}}
function complete(){stars();tone(true);$('message').textContent=level===5?'🏆 You completed every level!':'🎉 Level complete!';if(level<5){$('next').classList.remove('hidden')}else{$('next').textContent='Play again from level 1';$('next').classList.remove('hidden')}}
$('next').onclick=()=>{level=level<5?level+1:1;$('next').textContent='Next level ▶';start()};$('restart').onclick=start;start();
</script>










<footer class="compass-copyright" data-compass-hardwired-branding>
  © 2026 Compass SEN Support. All rights reserved.
  <span class="tagline">Guiding Every Step. Empowering Every Child.</span>
</footer>

</body></html>
