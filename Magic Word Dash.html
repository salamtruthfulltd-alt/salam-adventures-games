<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Word Dash | Reading Game for Kids | Salam Adventures</title><meta name="description" content="Free early reading game for children with word matching, sounds, colourful goals, levels and literacy challenges."><style>body{margin:0;font-family:Arial;text-align:center;background:#f8f0ff;color:#10294a}.w{max-width:1100px;margin:auto;padding:30px}.g{background:white;padding:40px;border-radius:34px;box-shadow:0 20px 55px #2343}.word{font-size:3.5rem;font-weight:900;padding:30px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.choices button{min-height:150px;border:2px solid #e4dff0;border-radius:28px;background:#fbf9ff;font-size:1.8rem;font-weight:900;cursor:pointer}.hud{font-size:1.2rem;font-weight:900}</style></head><body><div class="w"><a href="/">← Salam Adventures</a><h1>📚 Magic Word Dash</h1><p>Match the word to the correct picture clue. Earn five stars to level up.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Stars <b id="s">0</b>/5</div><div class="word" id="word"></div><div class="choices" id="choices"></div><h2 id="m"></h2></div></div><script>const words=[['cat','🐱'],['dog','🐶'],['sun','☀️'],['moon','🌙'],['fish','🐟'],['book','📖'],['star','⭐'],['tree','🌳']];let ans='',score=0,level=1;function tone(f){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}function round(){let x=words[Math.floor(Math.random()*words.length)];ans=x[1];word.textContent=x[0];let opts=[x,...words.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);choices.innerHTML='';opts.forEach(v=>{let b=document.createElement('button');b.textContent=v[1];b.onclick=()=>{if(v[1]===ans){score++;tone(720);m.textContent='Great reading! ✨';if(score===5){level++;score=0;m.textContent='Level up!'}}else{tone(150);m.textContent='Try another picture.'}s.textContent=score;l.textContent=level;setTimeout(round,450)};choices.appendChild(b)})}round()</script></body></html>
