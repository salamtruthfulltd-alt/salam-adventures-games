</head><body><main class="wrap"><h1>🎯 Spot & Circle</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Found <b id="found">0</b>/<b id="needed">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="target">Find every <b id="target"></b></div><div class="board" id="board"></div><div class="message" id="message">Tap each matching picture.</div><div class="actions"><button class="btn alt" id="restart">Restart level</button><button class="btn hidden" id="next">Next level</button></div></main><script>const pools=[['⭐','🌙','☀️'],['🐶','🐱','🐰','🐸'],['🍎','🍌','🍇','🍊','🥕'],['A','B','C','D','E','F'],['2','3','5','6','8','9']];let level=1,stars=0,target,items=[],found=0,needed=0,done=false;const e=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(){done=false;found=0;const pool=pools[level-1],count=level<3?12:level===3?16:20;target=pool[Math.floor(Math.random()*pool.length)];needed=Math.min(2+level,6);items=Array(needed).fill(target);while(items.length<count)items.push(pool[Math.floor(Math.random()*pool.length)]);items=shuffle(items);render()}function render(){e('level').textContent=level;e('found').textContent=found;e('needed').textContent=needed;e('target').textContent=target;e('board').style.gridTemplateColumns=`repeat(${level<3?3:4},1fr)`;e('board').innerHTML=items.map((v,i)=>`<button class="tile" data-i="${i}">${v}</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));e('next').classList.add('hidden');e('message').textContent='Tap each matching picture.'}function choose(i,b){if(done||b.classList.contains('hit'))return;if(items[i]===target){b.classList.add('hit');found++;stars++;e('found').textContent=found;e('stars').textContent=stars;tone(true);if(found===needed){done=true;e('message').textContent='🎉 You found them all!';e('next').textContent=level===5?'Play again':'Next level';e('next').classList.remove('hidden');burst()}else e('message').textContent='✅ Great spotting! Keep looking.'}else{tone(false);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350);e('message').textContent='Not that one — look for the target.'}}function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.06;o.start();o.stop(c.currentTime+.14)}function burst(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-400)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}e('restart').onclick=start;e('next').onclick=()=>{if(level<5)level++;else{level=1;stars=0;e('stars').textContent=0}start()};start();</script></body></html>
