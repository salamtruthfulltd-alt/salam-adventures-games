<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot & Circle</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:950px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;position:relative;overflow:hidden}h1{text-align:center;margin:0}.stats,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{background:#eef3fc;padding:10px 15px;border-radius:999px;font-weight:800}.target{text-align:center;background:#fff7df;border-radius:22px;padding:18px;font-size:24px;font-weight:800}.target b{font-size:50px}.board{display:grid;gap:12px;margin:20px 0}.tile{min-height:90px;border:4px solid #e1e7ef;border-radius:22px;background:#fff;font-size:50px;cursor:pointer;transition:.15s}.tile:hover,.tile:focus{transform:scale(1.03);border-color:#f5a623}.tile.hit{background:#d9f0e1;border-color:#2c5a2e}.tile.wrong{animation:shake .25s;background:#ffe5e5}.message{text-align:center;padding:13px;background:#eef3fc;border-radius:18px;font-size:18px;font-weight:800}.btn{border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;background:#2c5a2e;color:white;cursor:pointer}.btn.alt{background:#f5a623}.hidden{display:none}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.spark{position:fixed;pointer-events:none;font-size:26px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}</style>



<style data-compass-hardwired-branding>
.compass-brand-bar{width:min(1180px,calc(100% - 24px));margin:12px auto 18px;padding:12px 18px;background:#fff;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 8px 22px rgba(9,49,73,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Arial,sans-serif}.compass-brand-logo{width:190px;max-width:42vw;height:auto;display:block}.compass-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:2px solid #0a98a8;border-radius:999px;color:#06365b;background:#fff;text-decoration:none;font-weight:800;font-size:16px}.compass-back-link:hover,.compass-back-link:focus{background:#eaf9fb;outline:3px solid rgba(10,152,168,.18)}.compass-copyright{width:min(1180px,calc(100% - 24px));margin:22px auto 12px;padding:14px;text-align:center;border-top:1px solid #dfe8ef;color:#31536a;font:700 13px/1.5 Arial,sans-serif;background:#fff;border-radius:16px}.compass-copyright .tagline{display:block;margin-top:4px;color:#6d3fb2;font-weight:700}@media print{.compass-back-link{display:none}.compass-brand-bar{box-shadow:none;border:none;margin:0 auto 10px}.compass-brand-logo{width:150px}.compass-copyright{box-shadow:none;border-radius:0;margin-top:12px}}@media(max-width:560px){.compass-brand-bar{justify-content:center;text-align:center}.compass-brand-logo{width:170px}.compass-back-link{width:100%}}
</style>

</head><body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>



<main class="wrap"><h1>🎯 Spot & Circle</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Found <b id="found">0</b>/<b id="needed">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="target">Find every <b id="target"></b></div><div class="board" id="board"></div><div class="message" id="message">Tap each matching picture.</div><div class="actions"><button class="btn alt" id="restart">Restart level</button><button class="btn hidden" id="next">Next level</button></div></main><script>const pools=[['⭐','🌙','☀️'],['🐶','🐱','🐰','🐸'],['🍎','🍌','🍇','🍊','🥕'],['A','B','C','D','E','F'],['2','3','5','6','8','9']];let level=1,stars=0,target,items=[],found=0,needed=0,done=false;const e=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(){done=false;found=0;const pool=pools[level-1],count=level<3?12:level===3?16:20;target=pool[Math.floor(Math.random()*pool.length)];needed=Math.min(2+level,6);items=Array(needed).fill(target);while(items.length<count)items.push(pool[Math.floor(Math.random()*pool.length)]);items=shuffle(items);render()}function render(){e('level').textContent=level;e('found').textContent=found;e('needed').textContent=needed;e('target').textContent=target;e('board').style.gridTemplateColumns=`repeat(${level<3?3:4},1fr)`;e('board').innerHTML=items.map((v,i)=>`<button class="tile" data-i="${i}">${v}</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));e('next').classList.add('hidden');e('message').textContent='Tap each matching picture.'}function choose(i,b){if(done||b.classList.contains('hit'))return;if(items[i]===target){b.classList.add('hit');found++;stars++;e('found').textContent=found;e('stars').textContent=stars;tone(true);if(found===needed){done=true;e('message').textContent='🎉 You found them all!';e('next').textContent=level===5?'Play again':'Next level';e('next').classList.remove('hidden');burst()}else e('message').textContent='✅ Great spotting! Keep looking.'}else{tone(false);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350);e('message').textContent='Not that one — look for the target.'}}function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.06;o.start();o.stop(c.currentTime+.14)}function burst(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-400)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}e('restart').onclick=start;e('next').onclick=()=>{if(level<5)level++;else{level=1;stars=0;e('stars').textContent=0}start()};start();</script>



<footer class="compass-copyright" data-compass-hardwired-branding>

</body></html>
