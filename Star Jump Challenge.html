<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Jump Challenge | Coordination Game | Salam Adventures</title><meta name="description" content="Free star catching coordination game for children with glowing targets, sounds, score goals, levels and movement challenges."><style>body{margin:0;font-family:Arial;text-align:center;background:#edf5ff;color:#10294a}.w{max-width:1100px;margin:auto;padding:30px}.g{background:linear-gradient(#112b65,#351d67);color:white;padding:30px;border-radius:34px;box-shadow:0 20px 55px #1234}.sky{height:480px;position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at top,#294f94,#091733)}.star{position:absolute;border:0;background:none;font-size:5rem;cursor:pointer;filter:drop-shadow(0 0 15px #ffe96a)}.hud{font-size:1.2rem;font-weight:900;margin-bottom:20px}</style></head><body><div class="w"><a href="/">← Salam Adventures</a><h1>⭐ Star Jump Challenge</h1><p>Catch the glowing stars before they move. Reach the goal to level up.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Stars <b id="s">0</b>/<b id="goal">6</b></div><div class="sky" id="sky"></div><h2 id="m">Catch a star!</h2></div></div><script>let score=0,level=1;function tone(){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=850;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}function spawn(){sky.innerHTML='';let b=document.createElement('button');b.className='star';b.textContent='⭐';b.style.left=Math.random()*(sky.clientWidth-90)+'px';b.style.top=Math.random()*(sky.clientHeight-90)+'px';b.onclick=()=>{score++;tone();if(score>=5+level){level++;score=0;m.textContent='Level up — quicker stars! ✨'}s.textContent=score;l.textContent=level;goal.textContent=5+level;spawn()};sky.appendChild(b);setTimeout(()=>{if(sky.contains(b))spawn()},Math.max(700,1900-level*120))}spawn()</script></body></html>
