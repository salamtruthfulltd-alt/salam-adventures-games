</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>⭐ Star Jump Challenge</h1><p>Catch the glowing stars before they move. Reach the goal to level up.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Stars <b id="s">0</b>/<b id="goal">6</b></div><div class="sky" id="sky"></div><h2 id="m">Catch a star!</h2></div></div><script>let score=0,level=1;function tone(){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=850;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}function spawn(){sky.innerHTML='';let b=document.createElement('button');b.className='star';b.textContent='⭐';b.style.left=Math.random()*(sky.clientWidth-90)+'px';b.style.top=Math.random()*(sky.clientHeight-90)+'px';b.onclick=()=>{score++;tone();if(score>=5+level){level++;score=0;m.textContent='Level up — quicker stars! ✨'}s.textContent=score;l.textContent=level;goal.textContent=5+level;spawn()};sky.appendChild(b);setTimeout(()=>{if(sky.contains(b))spawn()},Math.max(700,1900-level*120))}spawn()</script></body></html>
