</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🦁 Sound Safari</h1><p>Listen to the sound clue, then choose the matching safari friend.</p><div class="g"><div class="hud"><span>Level <b id="l">1</b></span><span>Stars <b id="s">0</b></span><span>Goal <b id="goal">5</b></span></div><p id="m">Press the sound button to begin.</p><button class="play" id="play">🔊 Play sound clue</button><div class="choices" id="choices"></div></div></div><script>const animals=[['🦁',220],['🐘',280],['🐒',360],['🦜',520]];let target=0,score=0,level=1;function tone(f){let c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.08;o.start();o.stop(c.currentTime+.35)}function round(){target=Math.floor(Math.random()*animals.length);tone(animals[target][1]);m.textContent='Which friend made that sound?'}play.onclick=round;animals.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{if(i===target){score++;tone(700);m.textContent='Great listening! ⭐';if(score>=level*5){level++;score=0;m.textContent='Level up — new goal!'}}else{tone(140);m.textContent='Try listening once more.'}s.textContent=score;l.textContent=level;goal.textContent=level*5;setTimeout(round,450)};choices.appendChild(b)})</script></body></html>
