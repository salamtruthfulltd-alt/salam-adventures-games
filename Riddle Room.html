<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riddle Room | Guessing Puzzle | Salam Adventures</title><meta name="description" content="Play Riddle Room, a free child-friendly guessing puzzle with clues, levels, goals and sound feedback."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/Riddle%20Room.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fff7dc,#eef8ff);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#18305a;color:#fff;border-radius:34px;padding:28px;min-height:620px;box-shadow:0 20px 50px #0002}.hud{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:800}.room{max-width:900px;margin:28px auto;background:linear-gradient(135deg,#2c3d78,#55266e);border-radius:30px;padding:34px;text-align:center;min-height:430px}.clue{font-size:1.5rem;line-height:1.5;font-weight:800;max-width:700px;margin:20px auto}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.answers button{border:0;border-radius:20px;background:#fff;color:#17335d;min-height:80px;font-size:1.2rem;font-weight:900;cursor:pointer}.msg{font-size:1.15rem;font-weight:800;min-height:30px;margin-top:18px}@media(max-width:700px){.answers{grid-template-columns:1fr}.game{padding:16px}.room{padding:22px}.clue{font-size:1.2rem}}</style></head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>🕵️ Riddle Room</h1><p>Read the clues and guess the mystery answer.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Score <b id="score">0</b>/5</span><span>Clues <b id="clues">1</b></span></div><div class="room"><div style="font-size:5rem">🔐</div><div class="clue" id="clue"></div><div class="answers" id="answers"></div><div class="msg" id="msg">Solve the mystery.</div></div></div></div><script>const data=[{a:'Rainbow',c:['I appear after rain.','I have many colours.','You can see me in the sky.'],o:['Rainbow','Cloud','Moon']},{a:'Clock',c:['I have hands but cannot clap.','I help you know when to go.','I can hang on a wall.'],o:['Clock','Book','Chair']},{a:'Bee',c:['I can fly.','I visit flowers.','I make honey.'],o:['Bee','Butterfly','Bird']},{a:'Pencil',c:['You hold me in your hand.','I can make marks.','I often have an eraser.'],o:['Pencil','Spoon','Brush']},{a:'Moon',c:['I shine at night.','I can look round or crescent-shaped.','I move across the night sky.'],o:['Moon','Sun','Star']}];let level=1,score=0,current,shown=1;function beep(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}function round(){current=data[Math.floor(Math.random()*data.length)];shown=Math.max(1,3-Math.floor((level-1)/2));clue.textContent=current.c.slice(0,shown).join(' ');clues.textContent=shown;answers.innerHTML=current.o.sort(()=>Math.random()-.5).map(x=>`<button>${x}</button>`).join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>guess(b.textContent))}function guess(x){if(x===current.a){score++;beep(900);msg.textContent='Correct! Mystery solved ✨';if(score>=5){level++;score=0;msg.textContent='Level up — fewer clues next time 🌟'}}else{beep(160);msg.textContent='Not this one — use the clue carefully.'}document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;setTimeout(round,500)}round();</script></body></html>
