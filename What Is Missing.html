<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Is Missing? | Memory Guessing Game | Salam Adventures</title><meta name="description" content="Play What Is Missing?, a free child-friendly memory and guessing game with levels, goals, sound feedback and increasing challenge."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/What%20Is%20Missing.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fff7dc,#eef8ff);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#15315d;color:#fff;border-radius:34px;padding:28px;min-height:620px;box-shadow:0 20px 50px #0002}.hud{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:800}.tray{margin:28px auto;max-width:900px;min-height:260px;border-radius:30px;background:linear-gradient(135deg,#fff,#e6f4ff);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;padding:30px}.item{font-size:4.8rem;filter:drop-shadow(0 8px 10px #0002)}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:20px auto}.answers button{border:0;border-radius:18px;background:#fff;min-height:72px;font-size:2.4rem;cursor:pointer}.msg{text-align:center;font-size:1.2rem;font-weight:800;min-height:30px}.start{display:block;margin:18px auto;border:0;border-radius:18px;padding:16px 26px;font-weight:900;font-size:1.08rem;background:#fff;color:#17335d;cursor:pointer}@media(max-width:700px){.answers{grid-template-columns:repeat(2,1fr)}.item{font-size:3.2rem}.game{padding:16px}}</style></head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>❓ What Is Missing?</h1><p>Study the tray, then spot which item disappeared.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Score <b id="score">0</b>/5</span><span>Look time <b id="time">4</b>s</span></div><div class="tray" id="tray"></div><button class="start" id="start">Show tray</button><div class="answers" id="answers"></div><div class="msg" id="msg">Ready to remember?</div></div></div><script>const pool=['🍎','🚗','🐶','⭐','🎈','🦋','🧸','🌈','🍓','🚀','🐸','🎵'];let level=1,score=0,current=[],missing;function beep(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.09)}function round(){answers.innerHTML='';tray.innerHTML='';const n=Math.min(3+level,8),mix=[...pool].sort(()=>Math.random()-.5);current=mix.slice(0,n);missing=current[Math.floor(Math.random()*current.length)];tray.innerHTML=current.map(x=>`<span class="item">${x}</span>`).join('');start.style.display='none';msg.textContent='Look carefully…';let t=Math.max(2,5-Math.floor(level/2));time.textContent=t;setTimeout(()=>{tray.innerHTML=current.filter(x=>x!==missing).map(x=>`<span class="item">${x}</span>`).join('');const opts=[missing,...mix.filter(x=>!current.includes(x)).slice(0,3)].sort(()=>Math.random()-.5);answers.innerHTML=opts.map(x=>`<button>${x}</button>`).join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>guess(b.textContent));msg.textContent='What is missing?'},t*1000)}function guess(x){if(x===missing){score++;beep(900);msg.textContent='Yes! Great memory ✨';if(score>=5){level++;score=0;msg.textContent='Level up — more items next round 🌟'}}else{beep(150);msg.textContent='Good try — look again next round.'}document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;answers.innerHTML='';start.textContent='Next round';start.style.display='block'}start.onclick=round;</script></body></html>
