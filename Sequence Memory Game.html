*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#eef8ff,#fff7fc);margin:0;padding:18px;color:#17304d}.container{max-width:900px;margin:auto;background:#fff;border-radius:30px;box-shadow:0 14px 36px rgba(20,60,100,.12);padding:22px;overflow:hidden;position:relative}.header{display:flex;align-items:center;gap:12px;border-bottom:3px solid #ffc34d;padding-bottom:14px;flex-wrap:wrap}.logo-img{height:54px;max-width:150px}.brand-salam{font-size:24px;font-weight:900;color:#245e38}.brand-adventures{font-size:17px;font-weight:700;color:#e59a17}.game-badge{margin-left:auto;background:#eef5ff;padding:8px 14px;border-radius:30px;font-size:13px;font-weight:800}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.pill{background:#f2f7ff;border:2px solid #dce9fb;border-radius:18px;padding:12px;text-align:center;font-weight:800}.sequence-area{text-align:center;padding:28px;background:linear-gradient(180deg,#fff6cb,#ffe7a3);border-radius:26px;box-shadow:inset 0 -10px 0 rgba(157,89,10,.14)}.sequence-display{font-size:72px;min-height:100px;display:grid;place-items:center}.instruction{text-align:center;font-size:20px;font-weight:800;margin:18px 0}.options{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:16px;margin:20px 0}.seq-btn{min-height:120px;background:#fff;border:3px solid #cfe0f8;padding:18px;font-size:54px;border-radius:24px;cursor:pointer;box-shadow:0 7px 0 #b9cce8;transition:.12s}.seq-btn:hover,.seq-btn:focus{transform:translateY(-2px) scale(1.02);outline:4px solid #86c8ff}.seq-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b9cce8}.seq-btn:disabled{opacity:.5;cursor:not-allowed}.message{text-align:center;padding:16px;background:#eef5ff;border-radius:18px;font-size:18px;font-weight:700;min-height:58px}.controls{display:flex;gap:12px;margin-top:14px}.next-btn{flex:1;background:linear-gradient(90deg,#08a6c8,#226ee8);color:white;border:0;padding:17px 24px;border-radius:40px;font-size:19px;font-weight:900;cursor:pointer}.hidden{display:none}.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.spark{position:absolute;font-size:28px;animation:burst 1.4s ease-out forwards}.flash{animation:flash .7s ease}.level-card{text-align:center;padding:30px;background:linear-gradient(135deg,#fff3a5,#ffd1f0,#bfe8ff);border-radius:28px;margin:20px 0}.level-card h2{font-size:34px;margin:0 0 8px}.progress{height:16px;background:#e8eef8;border-radius:20px;overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#20b8d8,#7451e8);transition:width .3s}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.6) rotate(360deg)}}@keyframes flash{0%,100%{filter:none}30%{filter:brightness(1.35) drop-shadow(0 0 20px #ffe86c)}}@media(max-width:650px){.options{grid-template-columns:repeat(2,1fr)}.seq-btn{min-height:105px;font-size:48px}.status{grid-template-columns:1fr}.sequence-display{font-size:62px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="container" id="container">
<div class="header"><img src="Salam Adventures.png" alt="Salam Adventures" class="logo-img" onerror="this.style.display='none'"><div><div class="brand-salam">Salam</div><div class="brand-adventures">Adventures</div></div><div class="game-badge">🧠 Sequence Memory</div></div>
<div id="gameArea"></div>
</div>
<div class="celebration" id="celebration" aria-hidden="true"></div>
<script>
const symbols=['🐶','🐱','🐭','🐰','🦊','🐼'];
const LEVELS=[{rounds:3,start:2,speed:700},{rounds:4,start:3,speed:620},{rounds:5,start:4,speed:540},{rounds:6,start:5,speed:470},{rounds:7,start:6,speed:400}];
let level=1,round=1,sequence=[],player=[],active=false,waitingNext=false;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function tone(freq,duration=.12,type='sine',volume=.06){try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)}catch(e){}}
function levelConfig(){return LEVELS[Math.min(level-1,LEVELS.length-1)]}
function makeSequence(){const length=levelConfig().start+round-1;sequence=[];for(let i=0;i<length;i++)sequence.push(symbols[Math.floor(Math.random()*Math.min(4+Math.floor(level/2),symbols.length))]);}
function render(){const cfg=levelConfig();document.getElementById('gameArea').innerHTML=`<div class="status"><div class="pill">Level <span id="levelNum">${level}</span></div><div class="pill">Round <span id="roundNum">${round}</span> / ${cfg.rounds}</div><div class="pill">Sequence length <span id="lengthNum">${cfg.start+round-1}</span></div></div><div class="progress"><span style="width:${((round-1)/cfg.rounds)*100}%"></span></div><div class="sequence-area"><div class="sequence-display" id="sequenceDisplay">⭐</div></div><div class="instruction" id="instruction">Watch carefully, then repeat the sequence.</div><div class="options">${symbols.map(s=>`<button class="seq-btn" data-symbol="${s}" disabled>${s}</button>`).join('')}</div><div class="message" id="msg" aria-live="polite">Press Start when you are ready.</div><div class="controls"><button class="next-btn" id="startBtn">Start round</button><button class="next-btn hidden" id="nextBtn">Next round ➜</button><button class="next-btn hidden" id="retryBtn">Try again</button></div>`;bind();}
function bind(){document.querySelectorAll('.seq-btn').forEach(b=>b.onclick=()=>choose(b.dataset.symbol));document.getElementById('startBtn').onclick=startRound;document.getElementById('nextBtn').onclick=advance;document.getElementById('retryBtn').onclick=retry;}
function setChoices(enabled){document.querySelectorAll('.seq-btn').forEach(b=>b.disabled=!enabled)}
function startRound(){audio.resume?.();makeSequence();player=[];waitingNext=false;document.getElementById('startBtn').classList.add('hidden');document.getElementById('nextBtn').classList.add('hidden');document.getElementById('retryBtn').classList.add('hidden');document.getElementById('msg').textContent='Watch the full sequence.';showSequence();}
async function showSequence(){active=false;setChoices(false);const d=document.getElementById('sequenceDisplay');for(const item of sequence){d.textContent=item;tone(420+symbols.indexOf(item)*70,.16,'sine',.04);await wait(levelConfig().speed);d.textContent='•';await wait(Math.max(180,levelConfig().speed*.35));}d.textContent='⭐ Your turn!';document.getElementById('instruction').textContent=`Tap ${sequence.length} pictures in the same order.`;document.getElementById('msg').textContent='Your turn — start with the first picture.';active=true;setChoices(true);}
function choose(choice){if(!active)return;const index=player.length;player.push(choice);tone(520+symbols.indexOf(choice)*55,.1,'triangle',.05);if(choice!==sequence[index]){active=false;setChoices(false);document.getElementById('msg').textContent=`Not quite. The correct picture at step ${index+1} was ${sequence[index]}.`;document.getElementById('retryBtn').classList.remove('hidden');tone(170,.3,'sawtooth',.045);return;}document.getElementById('msg').textContent=`Great — ${player.length} of ${sequence.length} correct.`;if(player.length===sequence.length)completeRound();}
function completeRound(){active=false;setChoices(false);celebrate(round===levelConfig().rounds);document.getElementById('msg').textContent=round===levelConfig().rounds?`Level ${level} complete! Brilliant remembering!`:'Round complete! Press Next when you are ready.';document.getElementById('nextBtn').textContent=round===levelConfig().rounds?'Next level ➜':'Next round ➜';document.getElementById('nextBtn').classList.remove('hidden');waitingNext=true;}
function advance(){if(!waitingNext)return;if(round>=levelConfig().rounds){level++;round=1}else round++;render();document.getElementById('startBtn').focus();}
function retry(){player=[];document.getElementById('retryBtn').classList.add('hidden');document.getElementById('msg').textContent='Watch again, then have another go.';showSequence();}
function celebrate(big){const box=document.getElementById('celebration');box.innerHTML='';document.getElementById('container').classList.add('flash');setTimeout(()=>document.getElementById('container').classList.remove('flash'),750);const icons=big?['⭐','✨','🌟','🎉','💫']:['⭐','✨','💫'];for(let i=0;i<(big?44:24);i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[i%icons.length];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(40+Math.random()*15)+'vh';s.style.setProperty('--x',(Math.random()*900-450)+'px');s.style.setProperty('--y',(Math.random()*700-350)+'px');box.appendChild(s)}[660,780,920].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.07),i*110));setTimeout(()=>box.innerHTML='',1600)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
render();
</script>
</body>
