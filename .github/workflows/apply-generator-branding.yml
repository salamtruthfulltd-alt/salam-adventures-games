name: Apply generator branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-generators:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Brand generator pages and remove arcade styling
        shell: python
        run: |
          from pathlib import Path
          import re

          loader = '<script src="/assets/generator-branding.js" defer data-salam-generator-branding></script>'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8', errors='ignore')
              lower = text.lower()
              name = path.name.lower()

              is_generator = (
                  'generator' in name or
                  'worksheet' in name or
                  'generator' in lower or
                  'worksheet generator' in lower or
                  'times tables generator' in lower or
                  'printable generator' in lower
              )
              if not is_generator:
                  continue

              original = text
              text = re.sub(r'\s*<link[^>]+href=["\']/arcade-theme\.css["\'][^>]*>\s*', '\n', text, flags=re.I)

              if 'data-salam-generator-branding' not in text:
                  if '</head>' in text:
                      text = text.replace('</head>', f'    {loader}\n</head>', 1)
                  elif '<body' in text:
                      text = text.replace('<body', f'{loader}\n<body', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} generator files')
          for item in changed:
              print(item)

      - name: Commit generator separation and branding
        run: |
          if git diff --quiet; then
            echo "All generator files already protected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Separate generators from games and hardwire Salam branding"
          git push
