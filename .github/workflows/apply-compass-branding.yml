name: Apply Compass branding

on:
  push:
    branches:
      - agent/gameplay-levels-celebrations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hardwire-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gameplay-levels-celebrations
          fetch-depth: 0

      - name: Hardwire Compass logo and copyright
        run: python scripts/apply_compass_branding.py

      - name: Commit branded HTML files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Hardwire Compass branding across games and worksheets [skip ci]"
          git push origin HEAD:agent/gameplay-levels-celebrations
