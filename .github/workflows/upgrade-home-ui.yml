name: Adjust Salam Adventures hero crop

on:
  push:
    paths:
      - '.github/workflows/upgrade-home-ui.yml'

permissions:
  contents: write

jobs:
  adjust-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Crop hero top and reveal more of bottom
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".hero{position:relative;overflow:hidden;background:#eaf6ff;height:clamp(500px,35vw,640px)}.hero img{position:absolute;left:0;top:-18.5%;display:block;width:100%;height:auto;max-width:none}"
          new = ".hero{position:relative;overflow:hidden;background:#eaf6ff;height:clamp(560px,39vw,710px)}.hero img{position:absolute;left:0;top:-22.5%;display:block;width:100%;height:auto;max-width:none}"
          if old not in s:
              raise SystemExit('Expected hero CSS not found; refusing unrelated changes')
          s = s.replace(old, new, 1)
          old2 = "@media(max-width:1280px){.brand-sub{display:none}.nav-links{gap:7px}.nav-links a{min-width:78px;padding:10px 9px;font-size:.9rem}.grid{grid-template-columns:repeat(3,1fr)}.hero{height:clamp(460px,37vw,560px)}}"
          new2 = "@media(max-width:1280px){.brand-sub{display:none}.nav-links{gap:7px}.nav-links a{min-width:78px;padding:10px 9px;font-size:.9rem}.grid{grid-template-columns:repeat(3,1fr)}.hero{height:clamp(520px,41vw,620px)}}"
          if old2 not in s:
              raise SystemExit('Expected desktop hero media rule not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hero crop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Salam Adventures hero crop and reveal bottom"
          git push origin main
