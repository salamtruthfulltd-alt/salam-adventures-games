name: Fix Salam Adventures hero buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hero-buttons.yml'

permissions:
  contents: write

jobs:
  fix-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Precisely align hero action buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          style = '''<style id="hero-button-final-tune">
          @media screen and (min-width:981px){
            .hero-actions{left:10.8%!important;bottom:6.6%!important;gap:20px!important;align-items:center!important}
            .hero-btn{height:58px!important;min-height:58px!important;padding:0 22px!important;border-radius:16px!important;font-size:1.05rem!important;line-height:1!important;box-shadow:0 10px 24px rgba(36,48,89,.18)!important}
            .hero-btn:first-child{width:220px!important;min-width:220px!important}
            .hero-btn:nth-child(2){width:195px!important;min-width:195px!important}
          }
          </style>'''
          s = re.sub(r'<style id="hero-button-final-tune">.*?</style>\s*', '', s, flags=re.S)
          s = s.replace('</head>', style + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hero button alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hero button changes to commit"
          else
            git commit -m "Precisely align Salam Adventures hero buttons [skip ci]"
            git push origin main
          fi
