name: Polish Salam Adventures Homepage Layout

on:
  push:
    branches: [main]
    paths:
      - scripts/polish_home_layout.py
      - .github/workflows/polish-home-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout polish
        run: python scripts/polish_home_layout.py

      - name: Commit homepage layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage layout changes to commit"
          else
            git commit -m "Polish Salam Adventures homepage layout [skip ci]"
            git push
          fi
