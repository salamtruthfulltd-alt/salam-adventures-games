</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🔷 Shape Sprint</h1><p>Tap the shape named in the challenge. Build five correct answers to level up.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Score <b id="s">0</b>/5</div><h2 id="q"></h2><div class="cards" id="cards"></div><h3 id="m"></h3></div></div><script>const shapes=[['Circle','●'],['Square','■'],['Triangle','▲'],['Diamond','◆'],['Star','★'],['Heart','♥']];let target=0,score=0,level=1;function beep(f){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.08)}function round(){target=Math.floor(Math.random()*shapes.length);q.textContent='Find the '+shapes[target][0];cards.innerHTML='';shapes.sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(x[0]===shapes.find(y=>y[0]===q.textContent.replace('Find the ',''))[0]){score++;beep(700);m.textContent='Great spotting! ✨';if(score===5){level++;score=0;m.textContent='Level up!'}}else{beep(160);m.textContent='Try another shape.'}s.textContent=score;l.textContent=level;setTimeout(round,400)};cards.appendChild(b)})}round()</script></body></html>
