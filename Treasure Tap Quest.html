<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Tap Quest | Kids Challenge Game | Salam Adventures</title><meta name="description" content="Free treasure hunt game for children with action goals, sound rewards, glowing clues, levels and timed challenges."><style>body{margin:0;font-family:Arial;text-align:center;background:#fff7dc;color:#10294a}.w{max-width:1100px;margin:auto;padding:30px}.g{background:linear-gradient(#8ee0ff,#e7f9c5);padding:35px;border-radius:34px;box-shadow:0 20px 55px #2343}.map{height:450px;background:#d7b36a;border:12px solid #fff;border-radius:32px;position:relative;overflow:hidden}.chest{position:absolute;font-size:5rem;cursor:pointer;background:none;border:0;filter:drop-shadow(0 0 14px #fff)}.hud{font-size:1.2rem;font-weight:900;margin-bottom:20px}</style></head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🗺️ Treasure Tap Quest</h1><p>Find the glowing treasure chests. Each level adds a bigger goal.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Treasure <b id="s">0</b>/<b id="goal">5</b></div><div class="map" id="map"></div><h2 id="m">Find the treasure!</h2></div></div><script>let level=1,score=0;function tone(){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=760;o.connect(g);g.connect(c.destination);g.gain.value=.06;o.start();o.stop(c.currentTime+.12)}function spawn(){map.innerHTML='';let b=document.createElement('button');b.className='chest';b.textContent='💰';b.style.left=Math.random()*(map.clientWidth-100)+'px';b.style.top=Math.random()*(map.clientHeight-100)+'px';b.onclick=()=>{score++;tone();m.textContent='Treasure found! ✨';if(score>=4+level){level++;score=0;m.textContent='New island unlocked!'}s.textContent=score;l.textContent=level;goal.textContent=4+level;spawn()};map.appendChild(b)}spawn()</script></body></html>
