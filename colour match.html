<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colour Match</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;overflow:hidden}h1{text-align:center}.stats,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{padding:10px 15px;background:#eef3fc;border-radius:999px;font-weight:800}.target{width:180px;height:180px;border-radius:30px;margin:20px auto;border:5px solid #e2e7ee}.prompt,.message{text-align:center;padding:14px;border-radius:18px;font-size:20px;font-weight:800}.prompt{background:#fff8e8}.message{background:#eef3fc;margin:18px 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}.option{min-height:135px;border:5px solid #e2e7ee;border-radius:24px;cursor:pointer;font-size:20px;font-weight:900}.option:hover,.option:focus{transform:scale(1.03);border-color:#f5a623}.btn{border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;background:#2c5a2e;color:#fff;cursor:pointer}.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}</style></head><body><main class="wrap"><h1>🎨 Colour Match</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="prompt" id="prompt"></div><div class="target" id="target"></div><div class="options" id="options"></div><div class="message" id="message">Choose the matching colour.</div><div class="actions"><button class="btn" id="next" hidden>Next</button></div></main><script>const colours=[['Red','#ef4444'],['Blue','#3b82f6'],['Green','#22c55e'],['Yellow','#facc15'],['Orange','#f97316'],['Purple','#a855f7'],['Pink','#ec4899'],['Brown','#92400e'],['Grey','#6b7280'],['Turquoise','#14b8a6']];let level=1,round=1,stars=0,answer='',locked=false;const e=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.05;o.start();o.stop(c.currentTime+.15)}function burst(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-380)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}function load(){locked=false;e('next').hidden=true;e('level').textContent=level;e('round').textContent=round;const pool=colours.slice(0,4+level);const q=pool[Math.floor(Math.random()*pool.length)];answer=q[1];e('prompt').textContent=level<3?`Find ${q[0]}`:'Match this colour';e('target').style.background=q[1];const choices=shuffle([q,...shuffle(pool.filter(x=>x[1]!==q[1])).slice(0,Math.min(2+level,5))]);e('options').innerHTML=choices.map(x=>`<button class="option" data-v="${x[1]}" style="background:${x[1]};color:${['#facc15'].includes(x[1])?'#111':'#fff'}">${level<3?x[0]:''}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b.dataset.v));e('message').textContent='Choose the matching colour.'}function check(v){if(locked)return;if(v===answer){locked=true;stars+=3;e('stars').textContent=stars;e('message').textContent='✅ Excellent colour matching!';tone(true);burst();e('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';e('next').hidden=false}else{tone(false);e('message').textContent='Try again — compare the colours carefully.'}}e('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;e('stars').textContent=0}load()};load();</script></body></html>
