<body>

<div class="game">
  <h1>Tap & Count 🍎</h1>
  <div class="count" id="count">0</div>
  <div class="fruits" id="fruits"></div>
  <div class="text" id="text">Start counting!</div>
  <button onclick="next()">Tap</button>
</div>

<script>
const items = [
 {s:'banana',p:'bananas',e:'🍌'},
 {s:'apple',p:'apples',e:'🍎'},
 {s:'orange',p:'oranges',e:'🍊'},
 {s:'cherry',p:'cherries',e:'🍒'}
];

let count=0;
let item=random();

function random(){
 return items[Math.floor(Math.random()*items.length)];
}

function speak(t){
 if(!window.speechSynthesis) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.rate=0.9;
 speechSynthesis.speak(u);
}

function update(){
 document.getElementById('count').innerText=count;
 const grid=document.getElementById('fruits');
 grid.innerHTML='';

 for(let i=0;i<count;i++){
  const f=document.createElement('div');
  f.className='fruit';
  f.innerText=item.e;
  grid.appendChild(f);
 }

 if(count===0){
  text.innerText='Start counting!';
 }else if(count===10){
  text.innerText=`${count} ${item.p} - Amazing! Well done! Fantastic! 🎉`;
 }else{
  text.innerText=`${count} ${count===1?item.s:item.p}`;
 }
}

function next(){
 if(count>=10){
  count=0;
  item=random();
 }else{
  count++;
 }
 update();

 if(count===10){
  speak(`${count} ${item.p}. Amazing! Well done! Fantastic!`);
 }else{
  speak(`${count} ${count===1?item.s:item.p}`);
 }
}

update();
</script>
