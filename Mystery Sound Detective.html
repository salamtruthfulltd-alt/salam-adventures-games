<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Sound Detective | Guessing Game | Salam Adventures</title><meta name="description" content="Play Mystery Sound Detective, a free child-friendly listening and guessing game with sound clues, levels, goals and increasing challenge."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/Mystery%20Sound%20Detective.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#eaf7ff,#fff8dc);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#0f2546;color:#fff;border-radius:34px;padding:28px;box-shadow:0 20px 50px #0002;min-height:620px}.hud{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;font-weight:800}.panel{margin-top:24px;background:linear-gradient(135deg,#153b70,#281f62);border-radius:28px;padding:34px;text-align:center;min-height:450px}.speaker{font-size:7rem;filter:drop-shadow(0 0 24px #59d7ff)}button{border:0;border-radius:18px;padding:17px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;margin:8px;min-height:54px}.play{background:#fff;color:#17335d}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:760px;margin:24px auto}.answers button{background:#fff;color:#17335d;box-shadow:0 8px 20px #0003}.msg{font-size:1.2rem;font-weight:800;min-height:32px}@media(max-width:700px){.answers{grid-template-columns:1fr}.game{padding:16px}.panel{padding:20px}.speaker{font-size:5rem}}</style><link rel="stylesheet" href="/arcade-theme.css">
</head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>🔊 Mystery Sound Detective</h1><p>Listen carefully, then guess which sound you heard.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Score <b id="score">0</b>/<b id="goal">5</b></span><span>Lives <b id="lives">3</b></span></div><div class="panel"><div class="speaker">🔊</div><button class="play" id="play">▶ Play mystery sound</button><div class="answers" id="answers"></div><div class="msg" id="msg">Press play to hear the clue.</div></div></div></div><script>const sounds=[['High bell',880],['Low drum',180],['Robot beep',520],['Tiny chirp',1200],['Deep horn',260],['Magic ping',740]];let level=1,score=0,lives=3,current;function tone(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.type=level>2?'square':'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.45);o.start();o.stop(c.currentTime+.45)}function round(){current=sounds[Math.floor(Math.random()*Math.min(sounds.length,3+level))];const choices=[current];while(choices.length<3){let x=sounds[Math.floor(Math.random()*sounds.length)];if(!choices.includes(x))choices.push(x)}choices.sort(()=>Math.random()-.5);answers.innerHTML=choices.map(x=>`<button data-n="${x[0]}">${x[0]}</button>`).join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>guess(b.dataset.n))}function guess(n){if(n===current[0]){score++;msg.textContent='Correct! ✨';tone(980);if(score>=5){level++;score=0;msg.textContent='Level up — more sounds unlocked! 🌟'}}else{lives--;msg.textContent='Not quite — listen again.';tone(120);if(lives<=0){level=Math.max(1,level-1);lives=3;score=0;msg.textContent='New round — you can do it!'}}update();round()}function update(){levelEl.textContent=level;scoreEl.textContent=score;goal.textContent=5;livesEl.textContent=lives}const levelEl=document.getElementById('level'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');play.onclick=()=>tone(current[1]);round();</script></body></html>
