<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd One Out</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;overflow:hidden;position:relative}h1{text-align:center;margin:0 0 8px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.pill{background:#eef3fc;padding:10px 16px;border-radius:999px;font-weight:800}.question{text-align:center;background:#fff8e8;padding:22px;border-radius:22px;margin:18px 0;font-size:clamp(22px,4vw,34px);font-weight:800}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px}.item{min-height:130px;border:4px solid #eadfca;border-radius:24px;background:white;font-size:clamp(48px,8vw,78px);cursor:pointer;transition:.15s}.item:hover,.item:focus{transform:scale(1.03);border-color:#f5a623}.message{text-align:center;font-size:20px;font-weight:800;padding:14px;margin:16px 0;background:#eef3fc;border-radius:18px}.actions{display:flex;gap:12px}.btn{flex:1;border:0;border-radius:999px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;background:#2c5a2e;color:#fff}.btn.secondary{background:#f5a623}.hidden{display:none}.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly 1.3s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}.flash{animation:flash .55s}@keyframes flash{50%{box-shadow:0 0 50px #ffd84d}}</style>
<style data-compass-hardwired-branding>
.compass-brand-bar{width:min(1180px,calc(100% - 24px));margin:12px auto 18px;padding:12px 18px;background:#fff;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 8px 22px rgba(9,49,73,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Arial,sans-serif}.compass-brand-logo{width:190px;max-width:42vw;height:auto;display:block}.compass-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:2px solid #0a98a8;border-radius:999px;color:#06365b;background:#fff;text-decoration:none;font-weight:800;font-size:16px}.compass-back-link:hover,.compass-back-link:focus{background:#eaf9fb;outline:3px solid rgba(10,152,168,.18)}.compass-copyright{width:min(1180px,calc(100% - 24px));margin:22px auto 12px;padding:14px;text-align:center;border-top:1px solid #dfe8ef;color:#31536a;font:700 13px/1.5 Arial,sans-serif;background:#fff;border-radius:16px}.compass-copyright .tagline{display:block;margin-top:4px;color:#6d3fb2;font-weight:700}@media print{.compass-back-link{display:none}.compass-brand-bar{box-shadow:none;border:none;margin:0 auto 10px}.compass-brand-logo{width:150px}.compass-copyright{box-shadow:none;border-radius:0;margin-top:12px}}@media(max-width:560px){.compass-brand-bar{justify-content:center;text-align:center}.compass-brand-logo{width:170px}.compass-back-link{width:100%}}
</style>

</head><body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>
<main class="wrap" id="wrap"><h1>🔍 Odd One Out</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="question" id="question">Which one does not belong?</div><div class="items" id="items"></div><div class="message" id="message">Choose the odd one out.</div><div class="actions"><button class="btn secondary" id="restart">Restart level</button><button class="btn hidden" id="next">Next</button></div></main><script>const sets=[[['🐶','🐱','🐭','🍎'],3,'The apple is a fruit.'],[['🍎','🍌','🍊','🚗'],3,'The car is not a fruit.'],[['🚗','🚌','🚲','🐟'],3,'The fish is not a vehicle.'],[['🔴','🟢','🔵','🐰'],3,'The rabbit is not a colour.'],[['☀️','🌙','⭐','🥕'],3,'The carrot is not in the sky.'],[['A','B','C','7'],3,'7 is a number.'],[['2','4','6','🐸'],3,'The frog is not a number.'],[['⬜','⬛','🔺','🍇'],3,'The grape is not a shape.'],[['🐶','🐺','🦊','🍋'],3,'The lemon is not an animal.'],[['✏️','📘','📏','🚀'],3,'The rocket is not school equipment.']];let level=1,round=1,stars=0,locked=false,current;const el=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}function pick(){const base=sets[(level-1)*2+((round-1)%2)];const pairs=base[0].map((v,i)=>({v,correct:i===base[1]}));current={items:shuffle(pairs),why:base[2]};el('items').innerHTML=current.items.map((o,i)=>`<button class="item" data-i="${i}">${o.v}</button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>answer(+b.dataset.i));el('level').textContent=level;el('round').textContent=round;el('message').textContent='Choose the odd one out.';el('next').classList.add('hidden');locked=false}function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:180;g.gain.value=.08;o.start();o.stop(c.currentTime+.16)}function celebrate(){el('wrap').classList.add('flash');setTimeout(()=>el('wrap').classList.remove('flash'),600);for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-420-30)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}function answer(i){if(locked)return;locked=true;const ok=current.items[i].correct;tone(ok);if(ok){stars+=3;el('stars').textContent=stars;el('message').textContent='✅ Correct! '+current.why;celebrate();el('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';el('next').classList.remove('hidden')}else{el('message').textContent='Try again — look for the one from a different group.';locked=false}}el('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;el('stars').textContent=0}pick()};el('restart').onclick=()=>{round=1;pick()};pick();</script>
