</head><body><main class="wrap" id="wrap"><h1>🔍 Odd One Out</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="question" id="question">Which one does not belong?</div><div class="items" id="items"></div><div class="message" id="message">Choose the odd one out.</div><div class="actions"><button class="btn secondary" id="restart">Restart level</button><button class="btn hidden" id="next">Next</button></div></main><script>const sets=[[['🐶','🐱','🐭','🍎'],3,'The apple is a fruit.'],[['🍎','🍌','🍊','🚗'],3,'The car is not a fruit.'],[['🚗','🚌','🚲','🐟'],3,'The fish is not a vehicle.'],[['🔴','🟢','🔵','🐰'],3,'The rabbit is not a colour.'],[['☀️','🌙','⭐','🥕'],3,'The carrot is not in the sky.'],[['A','B','C','7'],3,'7 is a number.'],[['2','4','6','🐸'],3,'The frog is not a number.'],[['⬜','⬛','🔺','🍇'],3,'The grape is not a shape.'],[['🐶','🐺','🦊','🍋'],3,'The lemon is not an animal.'],[['✏️','📘','📏','🚀'],3,'The rocket is not school equipment.']];let level=1,round=1,stars=0,locked=false,current;const el=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}function pick(){const base=sets[(level-1)*2+((round-1)%2)];const pairs=base[0].map((v,i)=>({v,correct:i===base[1]}));current={items:shuffle(pairs),why:base[2]};el('items').innerHTML=current.items.map((o,i)=>`<button class="item" data-i="${i}">${o.v}</button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>answer(+b.dataset.i));el('level').textContent=level;el('round').textContent=round;el('message').textContent='Choose the odd one out.';el('next').classList.add('hidden');locked=false}function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:180;g.gain.value=.08;o.start();o.stop(c.currentTime+.16)}function celebrate(){el('wrap').classList.add('flash');setTimeout(()=>el('wrap').classList.remove('flash'),600);for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-420-30)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}function answer(i){if(locked)return;locked=true;const ok=current.items[i].correct;tone(ok);if(ok){stars+=3;el('stars').textContent=stars;el('message').textContent='✅ Correct! '+current.why;celebrate();el('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';el('next').classList.remove('hidden')}else{el('message').textContent='Try again — look for the one from a different group.';locked=false}}el('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;el('stars').textContent=0}pick()};el('restart').onclick=()=>{round=1;pick()};pick();</script></body></html>
