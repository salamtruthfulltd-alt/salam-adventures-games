<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Glow | Sequence Memory Game | Salam Adventures</title><meta name="description" content="Free visual memory game for children with glowing sequences, sound cues, levels and increasingly challenging goals."><style>body{margin:0;font-family:Arial;text-align:center;background:#f1f0ff;color:#10294a}.w{max-width:1000px;margin:auto;padding:30px}.g{background:#17204b;color:white;padding:40px;border-radius:34px;box-shadow:0 20px 55px #1234}.pads{display:grid;grid-template-columns:repeat(2,220px);gap:24px;justify-content:center;margin:30px}.p{height:190px;border:8px solid white;border-radius:34px;cursor:pointer;opacity:.72}.on{opacity:1!important;box-shadow:0 0 35px 15px white}.start{padding:16px 28px;border:0;border-radius:18px;font-size:1.1rem;font-weight:900}</style></head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🧠 Memory Glow</h1><p>Watch the glowing sequence, then repeat it. Each level adds another step.</p><div class="g"><h2>Level <b id="level">1</b></h2><p id="m">Ready to remember?</p><button class="start" id="start">Start sequence</button><div class="pads" id="pads"></div></div></div><script>const colors=['#ff668f','#ffd95a','#55d99b','#5ba8ff'];let seq=[],input=[],level=1,busy=false;colors.forEach((c,i)=>{let b=document.createElement('button');b.className='p';b.style.background=c;b.onclick=()=>tap(i);pads.appendChild(b)});function tone(i){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=260+i*110;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.12)}async function show(){busy=true;input=[];for(const i of seq){let b=pads.children[i];b.classList.add('on');tone(i);await new Promise(r=>setTimeout(r,430));b.classList.remove('on');await new Promise(r=>setTimeout(r,150))}busy=false;m.textContent='Your turn!'}function tap(i){if(busy)return;tone(i);input.push(i);if(seq[input.length-1]!==i){m.textContent='Good try — watch again.';setTimeout(show,700);return}if(input.length===seq.length){level++;document.getElementById('level').textContent=level;m.textContent='Brilliant! Level up ✨';setTimeout(()=>{seq.push(Math.floor(Math.random()*4));show()},700)}}start.onclick=()=>{start.style.display='none';seq=[Math.floor(Math.random()*4),Math.floor(Math.random()*4)];show()}</script></body></html>
