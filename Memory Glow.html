</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🧠 Memory Glow</h1><p>Watch the glowing sequence, then repeat it. Each level adds another step.</p><div class="g"><h2>Level <b id="level">1</b></h2><p id="m">Ready to remember?</p><button class="start" id="start">Start sequence</button><div class="pads" id="pads"></div></div></div><script>const colors=['#ff668f','#ffd95a','#55d99b','#5ba8ff'];let seq=[],input=[],level=1,busy=false;colors.forEach((c,i)=>{let b=document.createElement('button');b.className='p';b.style.background=c;b.onclick=()=>tap(i);pads.appendChild(b)});function tone(i){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=260+i*110;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.12)}async function show(){busy=true;input=[];for(const i of seq){let b=pads.children[i];b.classList.add('on');tone(i);await new Promise(r=>setTimeout(r,430));b.classList.remove('on');await new Promise(r=>setTimeout(r,150))}busy=false;m.textContent='Your turn!'}function tap(i){if(busy)return;tone(i);input.push(i);if(seq[input.length-1]!==i){m.textContent='Good try — watch again.';setTimeout(show,700);return}if(input.length===seq.length){level++;document.getElementById('level').textContent=level;m.textContent='Brilliant! Level up ✨';setTimeout(()=>{seq.push(Math.floor(Math.random()*4));show()},700)}}start.onclick=()=>{start.style.display='none';seq=[Math.floor(Math.random()*4),Math.floor(Math.random()*4)];show()}</script></body></html>
