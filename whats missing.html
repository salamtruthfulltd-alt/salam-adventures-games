<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Missing?</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:920px;margin:auto;background:white;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;position:relative;overflow:hidden}h1{text-align:center;margin:0}.stats,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{background:#eef3fc;padding:10px 15px;border-radius:999px;font-weight:800}.tray{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;background:#fff8e8;padding:28px;border-radius:24px;min-height:160px;align-items:center}.object{width:110px;height:110px;border:4px solid #e2e7ee;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:64px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin:20px 0}.option{min-height:125px;border:4px solid #e2e7ee;border-radius:24px;background:#fff;font-size:64px;cursor:pointer}.option:hover,.option:focus{transform:scale(1.03);border-color:#f5a623}.message{text-align:center;padding:14px;background:#eef3fc;border-radius:18px;font-size:19px;font-weight:800}.btn{border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;background:#2c5a2e;color:#fff;cursor:pointer}.btn.alt{background:#f5a623}.hidden{display:none}.spark{position:fixed;pointer-events:none;font-size:27px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}@media(max-width:560px){.object{width:82px;height:82px;font-size:48px}.option{font-size:52px}}</style></head><body><main class="wrap"><h1>🧠 What’s Missing?</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="tray" id="tray"></div><div class="message" id="message">Look carefully and remember the pictures.</div><div class="options hidden" id="options"></div><div class="actions"><button class="btn alt" id="show">I’m ready</button><button class="btn hidden" id="next">Next</button></div></main><script>const pool=['🐶','🐱','🐰','🦊','🍎','🍌','🚗','🚲','⭐','🌙','⚽','🎈','🌸','🐟','🦋'];let level=1,round=1,stars=0,shown=[],missing='',locked=false;const e=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(){locked=false;const count=2+level;shown=shuffle([...pool]).slice(0,count);missing=shown[Math.floor(Math.random()*shown.length)];e('tray').innerHTML=shown.map(v=>`<div class="object">${v}</div>`).join('');e('message').textContent='Look carefully and remember the pictures.';e('options').classList.add('hidden');e('show').classList.remove('hidden');e('next').classList.add('hidden');e('level').textContent=level;e('round').textContent=round}function hideOne(){e('tray').innerHTML=shown.filter(v=>v!==missing).map(v=>`<div class="object">${v}</div>`).join('');let choices=shuffle([missing,...shuffle(pool.filter(v=>!shown.includes(v))).slice(0,Math.min(2+level,5))]);e('options').innerHTML=choices.map(v=>`<button class="option" data-v="${v}">${v}</button>`).join('');e('options').classList.remove('hidden');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.dataset.v));e('message').textContent='Which picture is missing?';e('show').classList.add('hidden')}function answer(v){if(locked)return;if(v===missing){locked=true;stars+=3;e('stars').textContent=stars;e('message').textContent='✅ Correct! You remembered it.';tone(true);burst();e('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';e('next').classList.remove('hidden')}else{tone(false);e('message').textContent='Not that one. Look at what is left and try again.'}}function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?700:180;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}function burst(){for(let i=0;i<20;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*480-240)+'px');s.style.setProperty('--y',(Math.random()*-380)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}e('show').onclick=hideOne;e('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;e('stars').textContent=0}start()};start();</script></body></html>
