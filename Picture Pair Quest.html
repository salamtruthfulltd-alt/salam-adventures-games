<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture Pair Quest | Matching Game | Salam Adventures</title><meta name="description" content="Play Picture Pair Quest, a free child-friendly memory matching game with levels, goals, sound feedback and increasing challenge."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/Picture%20Pair%20Quest.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fff4df,#eaf7ff);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#14305a;border-radius:34px;padding:28px;color:#fff;min-height:620px;box-shadow:0 20px 50px #0002}.hud{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:800}.board{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{aspect-ratio:1/1;border:0;border-radius:24px;background:linear-gradient(135deg,#7047eb,#4f7be8);font-size:3.4rem;cursor:pointer;box-shadow:0 10px 22px #0003;color:transparent;transition:.2s}.card.open,.card.matched{background:#fff;color:#17335d;transform:scale(1.03)}.card.matched{outline:5px solid #7ef2b1}.msg{text-align:center;font-size:1.2rem;font-weight:800;margin-top:20px;min-height:30px}@media(max-width:700px){.board{grid-template-columns:repeat(3,1fr);gap:10px}.game{padding:16px}.card{font-size:2.5rem}}</style><link rel="stylesheet" href="/arcade-theme.css">
</head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>🧩 Picture Pair Quest</h1><p>Turn over two cards at a time and find every matching pair.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Pairs <b id="pairs">0</b>/<b id="goal">4</b></span><span>Moves <b id="moves">0</b></span></div><div class="board" id="board"></div><div class="msg" id="msg">Find the matching pairs.</div></div></div><script>const pool=['🐶','🐱','🦁','🐸','🦋','🌈','🚀','⭐','🍎','🎈'];let level=1,first=null,lock=false,moves=0,found=0;function beep(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}function setup(){const n=Math.min(4+level,8),icons=pool.slice(0,n),deck=[...icons,...icons].sort(()=>Math.random()-.5);board.style.gridTemplateColumns=`repeat(${n>6?4:n>4?4:3},1fr)`;board.innerHTML=deck.map((x,i)=>`<button class="card" data-v="${x}" data-i="${i}">${x}</button>`).join('');first=null;lock=false;moves=0;found=0;goal.textContent=n;update();board.querySelectorAll('.card').forEach(c=>c.onclick=()=>flip(c,n))}function flip(c,n){if(lock||c.classList.contains('matched')||c===first)return;c.classList.add('open');if(!first){first=c;return}moves++;if(first.dataset.v===c.dataset.v){first.classList.add('matched');c.classList.add('matched');found++;beep(850);first=null;msg.textContent='Match found! ✨';if(found===n){level++;msg.textContent='Level complete! More pairs next round 🌟';setTimeout(setup,900)}}else{lock=true;beep(180);setTimeout(()=>{first.classList.remove('open');c.classList.remove('open');first=null;lock=false},650)}update()}function update(){document.getElementById('level').textContent=level;pairs.textContent=found;document.getElementById('moves').textContent=moves}setup();</script></body></html>
