<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Chase Challenge | Free Kids Game | Salam Adventures</title><meta name="description" content="Play Light Chase Challenge, a free child-friendly reaction game with glowing targets, sound, levels, goals and increasing challenges."><meta name="robots" content="index,follow"><link rel="canonical" href="https://www.salamadventures.com/Light%20Chase%20Challenge.html"><style>body{margin:0;font-family:Arial;background:linear-gradient(#eaf8ff,#fff7dc);color:#10294a;text-align:center}.wrap{max-width:1100px;margin:auto;padding:28px}.game{min-height:620px;background:#10294a;border-radius:34px;padding:28px;box-shadow:0 20px 55px #0002;color:white;position:relative;overflow:hidden}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:900;font-size:1.2rem}.arena{height:430px;position:relative;margin-top:24px;border-radius:28px;background:radial-gradient(circle,#173d70,#07182e);overflow:hidden}.target{position:absolute;width:92px;height:92px;border-radius:50%;border:8px solid white;background:#ffe45c;box-shadow:0 0 28px 12px #ffe45c;cursor:pointer;font-size:42px}.start{padding:16px 28px;border:0;border-radius:18px;font-size:1.2rem;font-weight:900;background:white;color:#17335d;cursor:pointer}.goal{font-size:1.05rem}a{color:#17335d}</style></head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>✨ Light Chase Challenge</h1><p class="goal">Tap the glowing light before it moves. Reach the goal to unlock the next level.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Score <b id="score">0</b>/<b id="goal">6</b></span><span>Time <b id="time">30</b>s</span></div><p id="msg">Ready for the light chase?</p><button class="start" id="start">Start challenge</button><div class="arena" id="arena"></div></div></div><script>let score=0,level=1,time=30,timer;const a=arena;function beep(f=520){let c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.06;o.start();o.stop(c.currentTime+.08)}function spawn(){a.innerHTML='';let b=document.createElement('button');b.className='target';b.textContent='★';let s=Math.max(54,92-level*5);b.style.width=b.style.height=s+'px';b.style.left=Math.random()*(a.clientWidth-s)+'px';b.style.top=Math.random()*(a.clientHeight-s)+'px';b.onclick=()=>{score++;scoreEl();beep(620+level*60);if(score>=level*3+3){level++;score=0;msg.textContent='Level up! Faster lights ✨';}spawn()};a.appendChild(b)}function scoreEl(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('goal').textContent=level*3+3}start.onclick=()=>{clearInterval(timer);score=0;level=1;time=30;scoreEl();spawn();start.style.display='none';timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){clearInterval(timer);a.innerHTML='';msg.textContent='Challenge complete — Level '+level+' reached!';start.textContent='Play again';start.style.display='inline-block'}},1000)}</script></body></html>
