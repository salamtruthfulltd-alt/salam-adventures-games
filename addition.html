<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Adventure</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;overflow:hidden}.stats,.answers,.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.pill{background:#eef3fc;padding:10px 15px;border-radius:999px;font-weight:800}.question{text-align:center;font-size:clamp(42px,9vw,78px);font-weight:900;background:#fff8e8;border-radius:25px;padding:35px;margin:20px 0}.answer{min-width:145px;min-height:105px;border:4px solid #dfe7ee;background:#fff;border-radius:24px;font-size:38px;font-weight:900;cursor:pointer}.answer:hover,.answer:focus{border-color:#f5a623;transform:scale(1.03)}.message{text-align:center;padding:14px;background:#eef3fc;border-radius:18px;font-size:19px;font-weight:800;margin:16px 0}.btn{border:0;border-radius:999px;padding:14px 24px;font-size:17px;font-weight:800;background:#2c5a2e;color:#fff;cursor:pointer}.hidden{display:none}.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}</style></head><body><main class="wrap"><h1 style="text-align:center">➕ Maths Adventure</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/6</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="message" id="message">Choose the correct answer.</div><div class="actions"><button class="btn hidden" id="next">Next</button></div></main><script>let level=1,round=1,stars=0,correct=0,locked=false;const e=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function make(){locked=false;const max=[5,10,20,50,100][level-1];let a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*max),op=level<3?'+':(Math.random()<.55?'+':'−');if(op==='−'&&b>a)[a,b]=[b,a];correct=op==='+'?a+b:a-b;e('question').textContent=`${a} ${op} ${b} = ?`;let opts=new Set([correct]);while(opts.size<4){opts.add(Math.max(0,correct+Math.floor(Math.random()*9)-4))}e('answers').innerHTML=shuffle([...opts]).map(v=>`<button class="answer" data-v="${v}">${v}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>check(+b.dataset.v));e('message').textContent='Choose the correct answer.';e('next').classList.add('hidden');e('level').textContent=level;e('round').textContent=round}function check(v){if(locked)return;if(v===correct){locked=true;stars+=3;e('stars').textContent=stars;e('message').textContent='✅ Correct! Brilliant maths!';tone(720);burst();e('next').textContent=round===6?(level===5?'Play again':'Next level'):'Next round';e('next').classList.remove('hidden')}else{e('message').textContent='Not quite. Try another answer.';tone(190)}}function tone(f){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.05;o.start();o.stop(c.currentTime+.14)}function burst(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-380)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}e('next').onclick=()=>{if(round<6)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;e('stars').textContent=0}make()};make();</script></body></html>
