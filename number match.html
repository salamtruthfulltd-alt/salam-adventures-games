<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Match</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eef4fa;color:#183247}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #0002;overflow:hidden}h1{text-align:center}.stats,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{padding:10px 15px;background:#eef3fc;border-radius:999px;font-weight:800}.prompt,.message{text-align:center;padding:16px;border-radius:18px;font-size:21px;font-weight:800}.prompt{background:#fff8e8;margin:18px 0}.objects{font-size:58px;letter-spacing:6px;line-height:1.35}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}.option{min-height:120px;border:4px solid #e2e7ee;border-radius:24px;background:#fff;font-size:54px;font-weight:900;cursor:pointer}.option:hover,.option:focus{transform:scale(1.03);border-color:#f5a623}.message{background:#eef3fc;margin:18px 0}.btn{border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;background:#2c5a2e;color:#fff;cursor:pointer}.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}</style>









<style data-compass-hardwired-branding>
.compass-brand-bar{width:min(1180px,calc(100% - 24px));margin:12px auto 18px;padding:12px 18px;background:#fff;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 8px 22px rgba(9,49,73,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Arial,sans-serif}.compass-brand-logo{width:190px;max-width:42vw;height:auto;display:block}.compass-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:2px solid #0a98a8;border-radius:999px;color:#06365b;background:#fff;text-decoration:none;font-weight:800;font-size:16px}.compass-back-link:hover,.compass-back-link:focus{background:#eaf9fb;outline:3px solid rgba(10,152,168,.18)}.compass-copyright{width:min(1180px,calc(100% - 24px));margin:22px auto 12px;padding:14px;text-align:center;border-top:1px solid #dfe8ef;color:#31536a;font:700 13px/1.5 Arial,sans-serif;background:#fff;border-radius:16px}.compass-copyright .tagline{display:block;margin-top:4px;color:#6d3fb2;font-weight:700}@media print{.compass-back-link{display:none}.compass-brand-bar{box-shadow:none;border:none;margin:0 auto 10px}.compass-brand-logo{width:150px}.compass-copyright{box-shadow:none;border-radius:0;margin-top:12px}}@media(max-width:560px){.compass-brand-bar{justify-content:center;text-align:center}.compass-brand-logo{width:170px}.compass-back-link{width:100%}}
</style>

</head><body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>









<main class="wrap"><h1>🔢 Number Match</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="prompt" id="prompt"></div><div class="options" id="options"></div><div class="message" id="message">Count and choose the matching number.</div><div class="actions"><button class="btn" id="next" hidden>Next</button></div></main><script>const icons=['🍎','⭐','🐟','🚗','🌸','⚽'];let level=1,round=1,stars=0,answer=0,locked=false;const e=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.05;o.start();o.stop(c.currentTime+.15)}function burst(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-380)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}function load(){locked=false;e('next').hidden=true;e('level').textContent=level;e('round').textContent=round;const max=level===1?5:level===2?10:level===3?15:level===4?20:30;answer=1+Math.floor(Math.random()*max);const icon=icons[Math.floor(Math.random()*icons.length)];e('prompt').innerHTML=`How many?<div class="objects">${icon.repeat(answer)}</div>`;const nums=new Set([answer]);while(nums.size<Math.min(3+level,6)){nums.add(Math.max(0,answer+(Math.floor(Math.random()*9)-4)))}const choices=shuffle([...nums]);e('options').innerHTML=choices.map(n=>`<button class="option" data-v="${n}">${n}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(Number(b.dataset.v)));e('message').textContent='Count and choose the matching number.'}function check(v){if(locked)return;if(v===answer){locked=true;stars+=3;e('stars').textContent=stars;e('message').textContent='✅ Correct counting!';tone(true);burst();e('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';e('next').hidden=false}else{tone(false);e('message').textContent='Try again — count each picture slowly.'}}e('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;e('stars').textContent=0}load()};load();</script>
