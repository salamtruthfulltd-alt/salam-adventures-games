<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sort It Factory | Sorting Game | Salam Adventures</title><meta name="description" content="Play Sort It Factory, a free child-friendly categorising game with levels, goals, sound feedback and increasing challenge."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://www.salamadventures.com/Sort%20It%20Factory.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#eef8ff,#fff5e6);color:#10294a}.wrap{max-width:1180px;margin:auto;padding:24px}.game{background:#10294a;color:#fff;border-radius:34px;padding:28px;min-height:620px;box-shadow:0 20px 50px #0002}.hud{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:800}.item{margin:28px auto;text-align:center;font-size:7rem;filter:drop-shadow(0 0 24px #5ad7ff)}.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:850px;margin:auto}.bin{border:0;border-radius:28px;min-height:150px;background:#fff;color:#17335d;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 12px 25px #0003}.bin span{display:block;font-size:3rem;margin-bottom:8px}.msg{text-align:center;font-size:1.15rem;font-weight:800;min-height:30px;margin-top:20px}@media(max-width:700px){.bins{grid-template-columns:1fr}.item{font-size:5rem}.game{padding:16px}}</style></head><body><div class="wrap"><p><a href="/">← Salam Adventures</a></p><h1>🏭 Sort It Factory</h1><p>Send each object to the correct category.</p><div class="game"><div class="hud"><span>Level <b id="level">1</b></span><span>Score <b id="score">0</b>/6</span><span>Streak <b id="streak">0</b></span></div><div class="item" id="item"></div><div class="bins" id="bins"></div><div class="msg" id="msg">Choose the right sorting bin.</div></div></div><script>const rounds=[{bins:[['Animals','🐾'],['Food','🍽️']],items:[['🐶',0],['🐱',0],['🍎',1],['🍓',1],['🐸',0],['🍕',1]]},{bins:[['Things that fly','☁️'],['Things on the ground','🌱']],items:[['✈️',0],['🦋',0],['🚗',1],['🐌',1],['🚀',0],['🐕',1]]},{bins:[['Living','🌿'],['Not living','🧱']],items:[['🌳',0],['🐟',0],['⚽',1],['📚',1],['🌷',0],['🚲',1]]}];let level=1,score=0,streak=0,current;function beep(f){const c=new(window.AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.08)}function next(){const r=rounds[(level-1)%rounds.length];current=r.items[Math.floor(Math.random()*r.items.length)];item.textContent=current[0];bins.innerHTML=r.bins.map((b,i)=>`<button class="bin" data-i="${i}"><span>${b[1]}</span>${b[0]}</button>`).join('');bins.querySelectorAll('button').forEach(b=>b.onclick=()=>guess(+b.dataset.i))}function guess(i){if(i===current[1]){score++;streak++;beep(880);msg.textContent='Sorted correctly! ✨';if(score>=6){level++;score=0;msg.textContent='Level up — new sorting rule! 🌟'}}else{streak=0;beep(160);msg.textContent='Try the other category next time.'}document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;setTimeout(next,400)}next();</script></body></html>
