<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compass SEN Support | Quick Recall</title><style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#edf9ff,#fff7fc);margin:0;padding:18px;color:#17304d}.container{max-width:920px;margin:auto;background:#fff;border-radius:30px;box-shadow:0 14px 36px rgba(20,60,100,.12);padding:22px;overflow:hidden;position:relative}.header{display:flex;align-items:center;gap:12px;border-bottom:3px solid #ffc34d;padding-bottom:14px;flex-wrap:wrap}.logo-img{height:54px;max-width:150px}.brand-salam{font-size:24px;font-weight:900;color:#245e38}.brand-adventures{font-size:17px;font-weight:700;color:#e59a17}.game-badge{margin-left:auto;background:#eef5ff;padding:8px 14px;border-radius:30px;font-size:13px;font-weight:800}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.pill{background:#f2f7ff;border:2px solid #dce9fb;border-radius:18px;padding:12px;text-align:center;font-weight:800}.question-area{text-align:center;padding:30px;background:linear-gradient(180deg,#fff7cb,#ffe6a5);border-radius:26px;box-shadow:inset 0 -10px 0 rgba(157,89,10,.12)}.question-text{font-size:34px;font-weight:900;line-height:1.25}.options{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:18px;margin:22px 0}.option-btn{min-height:115px;background:#fff;color:#17304d;border:3px solid #cfe0f8;padding:20px;font-size:34px;font-weight:800;border-radius:24px;cursor:pointer;box-shadow:0 7px 0 #b9cce8;transition:.12s}.option-btn:hover,.option-btn:focus{transform:translateY(-2px) scale(1.02);outline:4px solid #86c8ff}.option-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b9cce8}.option-btn.correct{background:#dfffe8;border-color:#42c66f}.option-btn.wrong{background:#ffe5e5;border-color:#e26b6b}.message{text-align:center;padding:16px;background:#eef5ff;border-radius:18px;font-size:19px;font-weight:800;min-height:60px}.next-btn{width:100%;margin-top:14px;background:linear-gradient(90deg,#08a6c8,#226ee8);color:#fff;border:0;padding:18px;border-radius:40px;font-size:20px;font-weight:900;cursor:pointer}.hidden{display:none}.progress{height:16px;background:#e8eef8;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#20b8d8,#7451e8);transition:width .3s}.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.spark{position:absolute;font-size:28px;animation:burst 1.4s ease-out forwards}.flash{animation:flash .7s ease}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(360deg) scale(1.6)}}@keyframes flash{30%{filter:brightness(1.35) drop-shadow(0 0 22px #ffe86c)}}@media(max-width:650px){.options{grid-template-columns:1fr}.option-btn{min-height:100px;font-size:30px}.status{grid-template-columns:1fr}.question-text{font-size:29px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style data-compass-hardwired-branding>
.compass-brand-bar{width:min(1180px,calc(100% - 24px));margin:12px auto 18px;padding:12px 18px;background:#fff;border:1px solid #dfe8ef;border-radius:20px;box-shadow:0 8px 22px rgba(9,49,73,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Arial,sans-serif}.compass-brand-logo{width:190px;max-width:42vw;height:auto;display:block}.compass-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:2px solid #0a98a8;border-radius:999px;color:#06365b;background:#fff;text-decoration:none;font-weight:800;font-size:16px}.compass-back-link:hover,.compass-back-link:focus{background:#eaf9fb;outline:3px solid rgba(10,152,168,.18)}.compass-copyright{width:min(1180px,calc(100% - 24px));margin:22px auto 12px;padding:14px;text-align:center;border-top:1px solid #dfe8ef;color:#31536a;font:700 13px/1.5 Arial,sans-serif;background:#fff;border-radius:16px}.compass-copyright .tagline{display:block;margin-top:4px;color:#6d3fb2;font-weight:700}@media print{.compass-back-link{display:none}.compass-brand-bar{box-shadow:none;border:none;margin:0 auto 10px}.compass-brand-logo{width:150px}.compass-copyright{box-shadow:none;border-radius:0;margin-top:12px}}@media(max-width:560px){.compass-brand-bar{justify-content:center;text-align:center}.compass-brand-logo{width:170px}.compass-back-link{width:100%}}
</style>

</head><body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>
<div class="container" id="container"><div class="header"><img src="Compass SEN Support.png" alt="Compass SEN Support" class="logo-img" onerror="this.style.display='none'"><div><div class="brand-salam">Salam</div><div class="brand-adventures">Adventures</div></div><div class="game-badge">⚡ Quick Recall</div></div><div id="gameArea"></div></div><div class="celebration" id="celebration"></div><script>
const LEVELS=[
[{q:'Which animal says woof?',o:['🐱 Cat','🐶 Dog','🐮 Cow','🦁 Lion'],a:1},{q:'Which one is a fruit?',o:['🥕 Carrot','🍎 Apple','🥦 Broccoli','🌽 Corn'],a:1},{q:'Which one flies in the sky?',o:['🚗 Car','🚲 Bike','✈️ Plane','🚢 Boat'],a:2},{q:'Which shape is round?',o:['🔺 Triangle','⚽ Ball','⬛ Square','⭐ Star'],a:1}],
[{q:'Which comes next: 1, 2, 3, ...?',o:['5','4','2','8'],a:1},{q:'Which animal lives in water?',o:['🐟 Fish','🐰 Rabbit','🐔 Chicken','🐝 Bee'],a:0},{q:'Which is used for writing?',o:['🥄 Spoon','✏️ Pencil','🧦 Sock','🔑 Key'],a:1},{q:'Which is the smallest number?',o:['7','2','9','5'],a:1},{q:'Which word begins with B?',o:['Cat','Ball','Sun','Fish'],a:1}],
[{q:'Which sequence is correct?',o:['1, 3, 2, 4','1, 2, 3, 4','4, 2, 3, 1','2, 1, 4, 3'],a:1},{q:'What comes next: 🔴 🔵 🔴 🔵 ...?',o:['🟢','🔴','🟡','⭐'],a:1},{q:'Which number makes 5 + ? = 8?',o:['1','2','3','4'],a:2},{q:'Which word rhymes with cat?',o:['Sun','Hat','Dog','Tree'],a:1},{q:'Which is heavier?',o:['🪶 Feather','🐘 Elephant','🍃 Leaf','🫧 Bubble'],a:1},{q:'What comes next: 2, 4, 6, ...?',o:['7','8','10','5'],a:1}]
];
let level=1,index=0,score=0,locked=false;const audio=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d=.14,t='sine',v=.06){try{const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function render(){const qs=LEVELS[Math.min(level-1,LEVELS.length-1)],q=qs[index];document.getElementById('gameArea').innerHTML=`<div class="status"><div class="pill">Level ${level}</div><div class="pill">Question ${index+1} / ${qs.length}</div><div class="pill">Stars ${score} ⭐</div></div><div class="progress"><span style="width:${(index/qs.length)*100}%"></span></div><div class="question-area"><div class="question-text">${q.q}</div></div><div class="options">${q.o.map((x,i)=>`<button class="option-btn" data-i="${i}">${x}</button>`).join('')}</div><div class="message" id="msg" aria-live="polite">Choose one answer.</div><button class="next-btn hidden" id="nextBtn">Next question ➜</button>`;document.querySelectorAll('.option-btn').forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.getElementById('nextBtn').onclick=next;locked=false;}
function answer(i){if(locked)return;audio.resume?.();locked=true;const qs=LEVELS[Math.min(level-1,LEVELS.length-1)],q=qs[index],buttons=[...document.querySelectorAll('.option-btn')];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add('correct');if(i===q.a){score++;buttons[i].classList.add('correct');document.getElementById('msg').textContent='Correct! You earned a star ⭐';celebrate(false);tone(660);setTimeout(()=>tone(820),100)}else{buttons[i].classList.add('wrong');document.getElementById('msg').textContent=`Good try. The correct answer is ${q.o[q.a]}.`;tone(180,.25,'sawtooth',.04)}document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('nextBtn').focus();}
function next(){const qs=LEVELS[Math.min(level-1,LEVELS.length-1)];if(index<qs.length-1){index++;render();return}finishLevel();}
function finishLevel(){celebrate(true);document.getElementById('gameArea').innerHTML=`<div class="question-area"><div class="question-text">🎉 Level ${level} complete!</div><p style="font-size:22px;font-weight:800">You collected ${score} stars.</p></div><button class="next-btn" id="continueBtn">${level<LEVELS.length?'Start level '+(level+1)+' ➜':'Play again from level 1'}</button>`;document.getElementById('continueBtn').onclick=()=>{if(level<LEVELS.length)level++;else level=1;index=0;score=0;render()};}
function celebrate(big){const box=document.getElementById('celebration');box.innerHTML='';document.getElementById('container').classList.add('flash');setTimeout(()=>document.getElementById('container').classList.remove('flash'),750);const icons=['⭐','✨','🌟','🎉','💫'];for(let i=0;i<(big?44:22);i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[i%icons.length];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(42+Math.random()*12)+'vh';s.style.setProperty('--x',(Math.random()*900-450)+'px');s.style.setProperty('--y',(Math.random()*700-350)+'px');box.appendChild(s)}if(big)[660,780,920].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.07),i*110));setTimeout(()=>box.innerHTML='',1600)}
render();
</script>
<footer class="compass-copyright" data-compass-hardwired-branding>
  © 2026 Compass SEN Support. All rights reserved.
  <span class="tagline">Guiding Every Step. Empowering Every Child.</span>
</footer>

</body></html>
