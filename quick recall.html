</head><body><div class="container" id="container"><div class="header"><img src="Salam Adventures.png" alt="Salam Adventures" class="logo-img" onerror="this.style.display='none'"><div><div class="brand-salam">Salam</div><div class="brand-adventures">Adventures</div></div><div class="game-badge">⚡ Quick Recall</div></div><div id="gameArea"></div></div><div class="celebration" id="celebration"></div><script>
const LEVELS=[
[{q:'Which animal says woof?',o:['🐱 Cat','🐶 Dog','🐮 Cow','🦁 Lion'],a:1},{q:'Which one is a fruit?',o:['🥕 Carrot','🍎 Apple','🥦 Broccoli','🌽 Corn'],a:1},{q:'Which one flies in the sky?',o:['🚗 Car','🚲 Bike','✈️ Plane','🚢 Boat'],a:2},{q:'Which shape is round?',o:['🔺 Triangle','⚽ Ball','⬛ Square','⭐ Star'],a:1}],
[{q:'Which comes next: 1, 2, 3, ...?',o:['5','4','2','8'],a:1},{q:'Which animal lives in water?',o:['🐟 Fish','🐰 Rabbit','🐔 Chicken','🐝 Bee'],a:0},{q:'Which is used for writing?',o:['🥄 Spoon','✏️ Pencil','🧦 Sock','🔑 Key'],a:1},{q:'Which is the smallest number?',o:['7','2','9','5'],a:1},{q:'Which word begins with B?',o:['Cat','Ball','Sun','Fish'],a:1}],
[{q:'Which sequence is correct?',o:['1, 3, 2, 4','1, 2, 3, 4','4, 2, 3, 1','2, 1, 4, 3'],a:1},{q:'What comes next: 🔴 🔵 🔴 🔵 ...?',o:['🟢','🔴','🟡','⭐'],a:1},{q:'Which number makes 5 + ? = 8?',o:['1','2','3','4'],a:2},{q:'Which word rhymes with cat?',o:['Sun','Hat','Dog','Tree'],a:1},{q:'Which is heavier?',o:['🪶 Feather','🐘 Elephant','🍃 Leaf','🫧 Bubble'],a:1},{q:'What comes next: 2, 4, 6, ...?',o:['7','8','10','5'],a:1}]
];
let level=1,index=0,score=0,locked=false;const audio=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d=.14,t='sine',v=.06){try{const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function render(){const qs=LEVELS[Math.min(level-1,LEVELS.length-1)],q=qs[index];document.getElementById('gameArea').innerHTML=`<div class="status"><div class="pill">Level ${level}</div><div class="pill">Question ${index+1} / ${qs.length}</div><div class="pill">Stars ${score} ⭐</div></div><div class="progress"><span style="width:${(index/qs.length)*100}%"></span></div><div class="question-area"><div class="question-text">${q.q}</div></div><div class="options">${q.o.map((x,i)=>`<button class="option-btn" data-i="${i}">${x}</button>`).join('')}</div><div class="message" id="msg" aria-live="polite">Choose one answer.</div><button class="next-btn hidden" id="nextBtn">Next question ➜</button>`;document.querySelectorAll('.option-btn').forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.getElementById('nextBtn').onclick=next;locked=false;}
function answer(i){if(locked)return;audio.resume?.();locked=true;const qs=LEVELS[Math.min(level-1,LEVELS.length-1)],q=qs[index],buttons=[...document.querySelectorAll('.option-btn')];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add('correct');if(i===q.a){score++;buttons[i].classList.add('correct');document.getElementById('msg').textContent='Correct! You earned a star ⭐';celebrate(false);tone(660);setTimeout(()=>tone(820),100)}else{buttons[i].classList.add('wrong');document.getElementById('msg').textContent=`Good try. The correct answer is ${q.o[q.a]}.`;tone(180,.25,'sawtooth',.04)}document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('nextBtn').focus();}
function next(){const qs=LEVELS[Math.min(level-1,LEVELS.length-1)];if(index<qs.length-1){index++;render();return}finishLevel();}
function finishLevel(){celebrate(true);document.getElementById('gameArea').innerHTML=`<div class="question-area"><div class="question-text">🎉 Level ${level} complete!</div><p style="font-size:22px;font-weight:800">You collected ${score} stars.</p></div><button class="next-btn" id="continueBtn">${level<LEVELS.length?'Start level '+(level+1)+' ➜':'Play again from level 1'}</button>`;document.getElementById('continueBtn').onclick=()=>{if(level<LEVELS.length)level++;else level=1;index=0;score=0;render()};}
function celebrate(big){const box=document.getElementById('celebration');box.innerHTML='';document.getElementById('container').classList.add('flash');setTimeout(()=>document.getElementById('container').classList.remove('flash'),750);const icons=['⭐','✨','🌟','🎉','💫'];for(let i=0;i<(big?44:22);i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[i%icons.length];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(42+Math.random()*12)+'vh';s.style.setProperty('--x',(Math.random()*900-450)+'px');s.style.setProperty('--y',(Math.random()*700-350)+'px');box.appendChild(s)}if(big)[660,780,920].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.07),i*110));setTimeout(()=>box.innerHTML='',1600)}
render();
</script></body></html>
