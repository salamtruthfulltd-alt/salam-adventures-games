</head><body><main class="wrap"><h1>🔷 Shape Match</h1><div class="stats"><span class="pill">Level <b id="level">1</b>/5</span><span class="pill">Round <b id="round">1</b>/5</span><span class="pill">⭐ <b id="stars">0</b></span></div><div class="prompt" id="prompt"></div><div class="options" id="options"></div><div class="message" id="message">Choose the matching shape.</div><div class="actions"><button class="btn" id="next" hidden>Next</button></div></main><script>const shapes=[['Circle','●'],['Square','■'],['Triangle','▲'],['Star','★'],['Heart','♥'],['Diamond','◆'],['Oval','⬭'],['Pentagon','⬟'],['Hexagon','⬢'],['Crescent','☾']];let level=1,round=1,stars=0,answer='',locked=false;const e=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function tone(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.05;o.start();o.stop(c.currentTime+.15)}function burst(){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-380)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}function load(){locked=false;e('next').hidden=true;e('level').textContent=level;e('round').textContent=round;const pool=shapes.slice(0,4+level);const q=pool[Math.floor(Math.random()*pool.length)];answer=q[1];e('prompt').innerHTML=`Find the <b>${q[0]}</b><span class="target">${q[1]}</span>`;const choices=shuffle([q,...shuffle(pool.filter(x=>x[1]!==q[1])).slice(0,Math.min(2+level,5))]);e('options').innerHTML=choices.map(x=>`<button class="option" data-v="${x[1]}" aria-label="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b.dataset.v));e('message').textContent='Choose the matching shape.'}function check(v){if(locked)return;if(v===answer){locked=true;stars+=3;e('stars').textContent=stars;e('message').textContent='✅ Brilliant shape matching!';tone(true);burst();e('next').textContent=round===5?(level===5?'Play again':'Next level'):'Next round';e('next').hidden=false}else{tone(false);e('message').textContent='Try again — look carefully at the shape.'}}e('next').onclick=()=>{if(round<5)round++;else if(level<5){level++;round=1}else{level=1;round=1;stars=0;e('stars').textContent=0}load()};load();</script></body></html>
