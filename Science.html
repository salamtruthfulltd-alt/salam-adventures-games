        /* Game Styling */

        .hidden { display: none; }
    </style>

<body>

<header class="compass-brand-bar" data-compass-hardwired-branding>
  <img class="compass-brand-logo" src="assets/compass-sen-support-logo.svg" alt="Compass SEN Support — Guiding Every Step. Empowering Every Child.">
  <a class="compass-back-link" href="index.html" aria-label="Back to Games">← Back to Games</a>
</header>


<div class="nav">
    <button class="tab-btn active" onclick="showSection('science', this)">🔬 Sci</button>
    <button class="tab-btn" onclick="showSection('maths', this)">🔢 Math</button>
    <button class="tab-btn" onclick="showSection('game', this)">🎮 Game</button>
</div>

<div id="science" class="section active">
    <div class="card">
        <span id="s-icon" class="emoji-big">🌍</span>
        <h2 id="s-title">Earth & Life</h2>
        <p id="s-text">The Earth is home to millions of different plants and animals!</p>
        <button class="action-btn" onclick="genScience()">New Topic ✨</button>
    </div>
</div>

<div id="maths" class="section">
    <div class="card">
        <span class="emoji-big">➕</span>
        <h2>Maths Generator</h2>
        <div id="math-sum" style="font-size: 35px; font-weight: bold; margin: 20px 0;">5 + 3 = 8</div>
        <button class="action-btn" style="background:#6f42c1" onclick="genMath()">Next Sum</button>
    </div>
</div>

<div id="game" class="section">
    <div id="bubble">😢</div>
    <button id="wand" class="action-btn" style="background:#ffc107; color:#000; font-size:30px;" onclick="pop()">🪄</button>
    <button id="treat" class="action-btn hidden" style="background:#e83e8c; font-size:30px;" onclick="feed()">🍬</button>
</div>

<script>
    // Tab Switcher
    function showSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // Science Logic
    const topics = [
        {i:"🪐", t:"Space", p:"There are 8 planets in our solar system."},
        {i:"🦋", t:"Nature", p:"Caterpillars turn into beautiful butterflies!"},
        {i:"🦷", t:"Body", p:"Your teeth are the hardest part of your whole body!"},
        {i:"⚡", t:"Energy", p:"Lightning is a giant spark of electricity!"}
    ];
    function genScience() {
        const item = topics[Math.floor(Math.random()*topics.length)];
        document.getElementById('s-icon').innerText = item.i;
        document.getElementById('s-title').innerText = item.t;
        document.getElementById('s-text').innerText = item.p;
    }

    // Maths Logic
    function genMath() {
        const n1 = Math.floor(Math.random() * 10);
        const n2 = Math.floor(Math.random() * 10);
        document.getElementById('math-sum').innerText = n1 + " + " + n2 + " = " + (n1 + n2);
    }

    // Game Logic
    function pop() {
        document.getElementById('bubble').classList.add('popped');
        document.getElementById('bubble').innerText = "😮";
        document.getElementById('wand').classList.add('hidden');
        document.getElementById('treat').classList.remove('hidden');
    }
    function feed() {
        document.getElementById('bubble').innerText = "😄";
        setTimeout(() => {
            document.getElementById('bubble').classList.remove('popped');
            document.getElementById('bubble').innerText = "😢";
            document.getElementById('wand').classList.remove('hidden');
            document.getElementById('treat').classList.add('hidden');
        }, 1500);
    }
</script>
