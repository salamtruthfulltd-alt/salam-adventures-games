</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🌈 Rainbow Reaction</h1><p>Watch for the glowing colour and tap it quickly to build your streak.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Streak <b id="s">0</b> · Goal <b id="goal">6</b></div><p id="m">Ready?</p><button class="start" id="start">Start</button><div class="pads" id="pads"></div></div></div><script>const cs=['#ff5d8f','#ffd84d','#59d98e','#61a8ff'];let target=-1,score=0,level=1;function tone(f){let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();o.stop(c.currentTime+.08)}cs.forEach((c,i)=>{let b=document.createElement('button');b.className='pad';b.style.background=c;b.onclick=()=>{if(i===target){score++;tone(700);m.textContent='Yes! ✨';if(score>=6+level){level++;score=0;m.textContent='Level up!'}next()}else{score=Math.max(0,score-1);tone(150);m.textContent='Watch for the glow.'}s.textContent=score;l.textContent=level;goal.textContent=6+level};pads.appendChild(b)});function next(){target=Math.floor(Math.random()*4);[...pads.children].forEach((b,i)=>b.style.boxShadow=i===target?'0 0 38px 18px '+cs[i]:'0 12px 30px #1233');setTimeout(()=>[...pads.children].forEach(b=>b.style.boxShadow='0 12px 30px #1233'),Math.max(350,950-level*70))}start.onclick=()=>{start.style.display='none';next()}</script></body></html>
