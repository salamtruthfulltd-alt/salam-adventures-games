</head><body><div class="w"><a href="/">← Salam Adventures</a><h1>🧩 Pattern Power</h1><p>Choose what comes next in the pattern. Complete five patterns to unlock the next level.</p><div class="g"><div class="hud">Level <b id="l">1</b> · Power <b id="s">0</b>/5</div><div class="pattern" id="p"></div><div class="choices" id="c"></div><h2 id="m"></h2></div></div><script>const icons=['🔵','⭐','🍎','🌙','🟩','💜'];let answer='',score=0,level=1;function tone(f){let x=new AudioContext,o=x.createOscillator(),g=x.createGain();o.frequency.value=f;o.connect(g);g.connect(x.destination);g.gain.value=.05;o.start();o.stop(x.currentTime+.1)}function round(){let a=icons[Math.floor(Math.random()*icons.length)],b=icons.filter(x=>x!==a)[Math.floor(Math.random()*(icons.length-1))];answer=a;p.textContent=a+' '+b+' '+a+' '+b+' '+a+' ?';let opts=[a,b,icons.find(x=>x!==a&&x!==b)].sort(()=>Math.random()-.5);c.innerHTML='';opts.forEach(v=>{let bt=document.createElement('button');bt.textContent=v;bt.onclick=()=>{if(v===answer){score++;tone(750);m.textContent='Pattern solved! ✨';if(score===5){level++;score=0;m.textContent='Level up!'}}else{tone(150);m.textContent='Look at the repeating pattern again.'}s.textContent=score;l.textContent=level;setTimeout(round,500)};c.appendChild(bt)})}round()</script></body></html>
